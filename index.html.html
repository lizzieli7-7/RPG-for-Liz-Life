<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生RPG</title>
<style>
  :root{
    --bg-1:#faf6ef;
    --bg-2:#f5ede0;
    --bg-3:#efe4d2;
    --card-1:rgba(255,253,248,.92);
    --card-2:rgba(252,246,235,.85);
    --card-soft:#fdf9f2;
    --line-1:rgba(180,150,110,.22);
    --line-2:rgba(180,150,110,.14);
    --ink-1:#3d3226;
    --ink-2:#5c4a38;
    --ink-3:#8a7762;
    --muted:#a89684;
    --gold:#d97706;
    --gold-2:#f59e0b;
    --gold-3:#fbbf24;
    --gold-deep:#92400e;
    --gold-soft:#fef3c7;
    --rose:#e11d48;
    --rose-2:#f43f5e;
    --green:#059669;
    --green-2:#10b981;
    --purple:#8b5cf6;
    --purple-2:#a78bfa;
    --shadow-card:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -1px 0 rgba(180,150,110,.06) inset,
      0 1px 2px rgba(150,110,70,.05),
      0 12px 28px -14px rgba(150,110,70,.22);
    --shadow-hover:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 -1px 0 rgba(180,150,110,.08) inset,
      0 2px 4px rgba(150,110,70,.06),
      0 18px 40px -18px rgba(150,110,70,.3);
    --r-sm:10px;
    --r:13px;
    --r-lg:18px;
    --r-xl:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 500px at 8% -8%, rgba(251,191,36,.15), transparent 62%),
      radial-gradient(900px 500px at 96% 4%, rgba(244,114,182,.08), transparent 60%),
      radial-gradient(900px 600px at 50% 108%, rgba(139,92,246,.05), transparent 62%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-attachment:fixed;
    color:var(--ink-1); min-height:100vh; font-size:14px;
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.28;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  header{
    padding:16px 26px; position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;
    background:rgba(250,246,239,.9);
    backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--line-1);
    box-shadow:0 4px 24px -18px rgba(150,110,70,.4);
  }
  .brand{display:flex; align-items:center; gap:12px}
  .avatar{
    width:44px; height:44px; border-radius:14px;
    background:linear-gradient(135deg,#fde68a,#fbbf24 55%,#f59e0b);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -2px 4px rgba(120,60,0,.15) inset,
      0 8px 18px -6px rgba(245,158,11,.55);
  }
  .brand-text{display:flex; flex-direction:column; gap:1px}
  .brand-name{
    font-size:18px; font-weight:900; letter-spacing:.03em;
    color:var(--ink-1);
  }
  .brand-name em{
    font-style:normal;
    background:linear-gradient(135deg,#d97706,#f59e0b 60%,#fb923c);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-sub{
    font-size:9.5px; font-weight:800; color:var(--muted);
    letter-spacing:.2em; text-transform:uppercase;
  }
  .player{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .level-badge{
    display:flex; align-items:center; gap:6px;
    padding:7px 15px; border-radius:999px;
    background:linear-gradient(180deg,#fbbf24,#e8940a);
    color:#fff; font-weight:900; font-size:12.5px;
    letter-spacing:.03em;
    text-shadow:0 1px 1px rgba(120,60,0,.3);
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 -2px 4px rgba(120,60,0,.2) inset,
      0 6px 16px -4px rgba(232,148,10,.5);
  }
  .level-badge::before{content:'★'; font-size:11px; opacity:.9}
  .xp-wrap{min-width:220px}
  .xp-label{
    display:flex; justify-content:space-between;
    font-size:10.5px; font-weight:800; letter-spacing:.1em;
    color:var(--muted); text-transform:uppercase;
    margin-bottom:5px;
    font-variant-numeric:tabular-nums;
  }
  .xp-label span:last-child{color:var(--ink-2)}
  .xp-bar{
    height:9px; border-radius:999px; overflow:hidden;
    background:linear-gradient(180deg,#efe0c8,#f5ead6);
    box-shadow:0 1px 3px rgba(150,110,70,.18) inset;
  }
  .xp-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,#fbbf24 0%,#f59e0b 45%,#f43f5e 100%);
    background-size:200% 100%;
    transition:width .7s cubic-bezier(.4,0,.2,1);
    border-radius:999px;
    box-shadow:0 0 12px rgba(251,146,60,.55);
    animation:xpFlow 5s linear infinite;
  }
  @keyframes xpFlow{from{background-position:0% 0}to{background-position:200% 0}}
  .coins{
    display:flex; align-items:center; gap:6px;
    padding:7px 15px; border-radius:999px;
    background:linear-gradient(180deg,#fffbeb,#fdecc7);
    border:1px solid rgba(217,119,6,.22);
    color:var(--gold-deep); font-weight:900; font-size:12.5px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 4px 10px -5px rgba(217,119,6,.3);
    font-variant-numeric:tabular-nums;
  }
  .stat-edit-btn{
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(180deg,#fbbf24,#e8940a);
    border:none; color:#fff; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s; flex-shrink:0;
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 6px 14px -4px rgba(232,148,10,.5);
    padding:0; font-weight:800;
  }
  .stat-edit-btn:hover{
    transform:scale(1.1) rotate(15deg);
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 8px 20px -4px rgba(232,148,10,.7);
  }

  main{
    max-width:1480px; margin:0 auto; padding:20px 26px 28px;
    display:grid;
    grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);
    gap:20px;
    position:relative; z-index:1;
    align-items:start;
  }
  @media(max-width:1080px){main{grid-template-columns:1fr; gap:16px}}
  @media(max-width:600px){
    header{padding:12px 14px; gap:12px}
    main{padding:14px 12px 24px; gap:14px}
    .brand-name{font-size:15px}
    .avatar{width:38px;height:38px;font-size:19px;border-radius:12px}
    .xp-wrap{min-width:150px}
    .panel{padding:16px}
  }
  .col{display:flex; flex-direction:column; gap:16px; min-width:0}

  .panel{
    background:linear-gradient(180deg,var(--card-1),var(--card-2));
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(255,255,255,.8);
    border-radius:var(--r-xl);
    padding:18px 20px;
    box-shadow:var(--shadow-card);
    transition:box-shadow .3s, transform .3s;
    position:relative;
  }
  .panel::before{
    content:''; position:absolute; top:0; left:20px; right:20px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
    pointer-events:none;
  }
  .panel:hover{box-shadow:var(--shadow-hover)}
  .panel h2{
    font-size:11.5px; margin:0 0 14px; font-weight:800;
    letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-3);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .h2-left{display:flex; align-items:center; gap:9px; min-width:0}
  .h2-deco{
    width:4px; height:14px; border-radius:2px; flex-shrink:0;
    background:linear-gradient(180deg,#fbbf24,#f59e0b 60%,#d97706);
    box-shadow:0 1px 4px rgba(245,158,11,.5);
  }
  .h2-text{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .h2-actions{display:flex; gap:6px; text-transform:none; letter-spacing:0; font-weight:600}

  .row{display:flex; gap:7px; flex-wrap:wrap}

  input,select,button,textarea{
    font-family:inherit; font-size:12.5px; border-radius:var(--r-sm);
    border:1.5px solid var(--line-1);
    background:linear-gradient(180deg,#fffdfa,#fbf6ec);
    color:var(--ink-1); padding:8px 12px; outline:none; transition:.18s;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
  }
  input::placeholder{color:#c1b19b}
  input:hover,select:hover{border-color:#e2d0b4}
  input:focus,select:focus{
    border-color:var(--gold-3);
    background:#fff;
    box-shadow:
      0 0 0 3px rgba(251,191,36,.18),
      0 1px 0 rgba(255,255,255,.9) inset;
  }
  select option{background:#fff; color:var(--ink-1)}
  button{
    cursor:pointer; border:1.5px solid var(--line-1);
    background:linear-gradient(180deg,#fffdfa,#f9f1e0);
    font-weight:700; color:var(--ink-2); transition:.18s;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 1px 2px rgba(180,140,90,.06);
  }
  button:hover{
    background:linear-gradient(180deg,#fff,#fdf5e6);
    border-color:#e2d0b4; color:var(--ink-1);
    transform:translateY(-1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 4px 10px -3px rgba(180,140,90,.22);
  }
  button:active{transform:translateY(0) scale(.98)}
  button:disabled{opacity:.45; cursor:not-allowed; transform:none !important}

  .btn-primary{
    background:linear-gradient(180deg,#fbbf24,#e8940a);
    border-color:#d97706; color:#fff; font-weight:800;
    text-shadow:0 1px 1px rgba(120,60,0,.28);
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 -2px 4px rgba(120,60,0,.2) inset,
      0 6px 14px -5px rgba(232,148,10,.55);
  }
  .btn-primary:hover{
    background:linear-gradient(180deg,#fcd34d,#f59e0b);
    border-color:#d97706;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 -2px 4px rgba(120,60,0,.22) inset,
      0 10px 20px -6px rgba(232,148,10,.65);
  }
  .btn-gold{
    background:linear-gradient(180deg,#fde68a,#fcd34d);
    border-color:#eab308; color:#78350f; font-weight:800;
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -2px 4px rgba(180,120,0,.15) inset,
      0 6px 14px -5px rgba(250,204,21,.55);
  }
  .btn-gold:hover{
    background:linear-gradient(180deg,#fef3c7,#fbbf24);
    box-shadow:
      0 1px 0 rgba(255,255,255,.8) inset,
      0 -2px 4px rgba(180,120,0,.18) inset,
      0 10px 22px -6px rgba(250,204,21,.65);
  }
  .btn-pink{
    background:linear-gradient(180deg,#fda4af,#f43f5e);
    border-color:#e11d48; color:#fff; font-weight:800;
    text-shadow:0 1px 1px rgba(120,10,60,.25);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 -2px 4px rgba(120,10,60,.2) inset,
      0 6px 14px -5px rgba(244,63,94,.55);
  }
  .btn-pink:hover{
    background:linear-gradient(180deg,#fb7185,#e11d48);
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 -2px 4px rgba(120,10,60,.22) inset,
      0 10px 22px -6px rgba(244,63,94,.65);
  }
  .btn-ghost{background:transparent; color:var(--muted); border-color:transparent; box-shadow:none; font-weight:600}
  .btn-ghost:hover{background:rgba(217,119,6,.1); color:var(--ink-2); transform:none; box-shadow:none}
  .btn-danger{background:transparent; color:#dc2626; border-color:rgba(220,38,38,.2); box-shadow:none}
  .btn-danger:hover{background:#fef2f2; border-color:rgba(220,38,38,.35); color:#b91c1c}
  .btn-sm{padding:4px 9px !important; font-size:11px !important; border-radius:7px !important}
  .btn-icon{padding:5px 8px !important; font-size:12px !important; line-height:1}

  .task{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:var(--r); margin-bottom:7px;
    background:linear-gradient(180deg,#fffdf9,#fbf5e9);
    border:1.5px solid var(--line-2);
    transition:.2s;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
  }
  .task:hover{
    background:linear-gradient(180deg,#fff,#fdf8ee);
    border-color:var(--line-1);
    transform:translateX(2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 6px 16px -9px rgba(180,140,90,.3);
  }
  .task.done{opacity:.55; background:linear-gradient(180deg,#fdf9f0,#f7f0e0)}
  .task.done .name{
    text-decoration:line-through;
    text-decoration-color:var(--muted);
    text-decoration-thickness:1.5px;
    color:var(--ink-3);
  }
  .task .name{flex:1; font-size:13px; color:var(--ink-1); font-weight:600; min-width:0}
  .tag{
    font-size:10.5px; padding:3px 9px; border-radius:999px;
    font-weight:800; white-space:nowrap;
    display:inline-flex; align-items:center; gap:3px;
    font-variant-numeric:tabular-nums;
  }
  .tag.xp{
    color:var(--gold-deep);
    background:linear-gradient(180deg,#fff5d6,#fde9b5);
    border:1px solid rgba(217,119,6,.25);
  }
  .tag.coin{
    color:#a16207;
    background:linear-gradient(180deg,#fffbeb,#fef3c7);
    border:1px solid rgba(234,179,8,.3);
  }
  .check{
    width:21px; height:21px; border-radius:7px;
    border:2px solid #d9c5a3; background:#fffdf9;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:.22s;
    font-size:11px; box-shadow:0 1px 2px rgba(180,140,90,.08);
  }
  .check:hover{
    border-color:var(--gold-3);
    transform:scale(1.1);
    box-shadow:0 2px 8px rgba(251,191,36,.35);
  }
  .check.on{
    background:linear-gradient(180deg,#fbbf24,#e8940a);
    border-color:#d97706; color:#fff; font-weight:900;
    text-shadow:0 1px 1px rgba(120,60,0,.3);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 2px 8px rgba(232,148,10,.45);
  }
  .edit-input{flex:1; min-width:70px; padding:5px 9px}
  .edit-num{width:58px; padding:5px 7px}

  .ck{
    background:linear-gradient(180deg,#fffdf9,#fbf5e9);
    border-radius:var(--r); margin-bottom:9px;
    border:1.5px solid var(--line-2); transition:.2s;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
  }
  .ck:hover{
    border-color:var(--line-1);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 6px 18px -12px rgba(180,140,90,.35);
  }
  .ck-row{display:flex; align-items:center; gap:10px; padding:11px 13px}
  .ck-name{
    flex:1; font-size:12.5px; cursor:help;
    padding:2px 0; font-weight:700; color:var(--ink-1);
    min-width:0; transition:.15s;
  }
  .ck-name:hover{color:var(--gold)}
  .ck-stats{
    font-size:10.5px; color:var(--muted); font-weight:800;
    white-space:nowrap; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fdf9f2,#f7efe0);
    padding:3px 9px; border-radius:999px;
    border:1px solid var(--line-2);
  }
  .ck-cal{
    padding:0 13px 13px; display:none;
    border-top:1px dashed var(--line-1);
    background:linear-gradient(180deg,#fffdf9,#fdf8ee);
  }
  .ck-cal.show{display:block; animation:calOpen .25s}
  .ck-cal.pinned{display:block}
  @keyframes calOpen{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:translateY(0)}}
  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; font-size:12px; color:var(--ink-2); font-weight:800;
  }
  .cal-head button{padding:3px 9px; font-size:11px; border-radius:7px}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-w{
    font-size:10px; text-align:center; color:var(--muted);
    padding:3px 0; font-weight:800;
  }
  .cal-day{
    text-align:center; padding:6px 0; border-radius:8px; font-size:11px;
    background:#fff; cursor:pointer;
    transition:.15s; user-select:none;
    color:var(--ink-2); font-weight:700;
    border:1.5px solid var(--line-2);
    font-variant-numeric:tabular-nums;
  }
  .cal-day:hover{
    background:linear-gradient(180deg,#fff8e6,#fdecc7);
    border-color:var(--gold-3);
    transform:translateY(-1px);
    box-shadow:0 3px 8px -3px rgba(251,191,36,.45);
  }
  .cal-day.checked{
    background:linear-gradient(180deg,#fbbf24,#e8940a);
    color:#fff; border-color:#d97706; font-weight:900;
    text-shadow:0 1px 1px rgba(120,60,0,.3);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 3px 10px -2px rgba(232,148,10,.55);
  }
  .cal-day.today{outline:2px solid #e11d48; outline-offset:1.5px}
  .cal-day.empty{background:transparent; cursor:default; border-color:transparent}
  .cal-day.empty:hover{background:transparent; transform:none; box-shadow:none}

  .ms{
    background:linear-gradient(180deg,#fffdf9,#fbf5e9);
    border-radius:var(--r-lg); padding:15px;
    margin-bottom:11px;
    border:1.5px solid var(--line-2); transition:.2s;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
  }
  .ms:hover{
    border-color:var(--line-1);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 8px 22px -14px rgba(180,140,90,.4);
  }
  .ms-head{
    display:flex; justify-content:space-between; align-items:center;
    gap:9px; margin-bottom:12px; flex-wrap:wrap;
  }
  .ms-title{
    font-size:13.5px; font-weight:800; flex:1; min-width:80px;
    color:var(--ink-1); display:flex; align-items:center; gap:6px;
  }
  .ms-title::before{content:'◆'; font-size:10px; color:var(--gold); opacity:.9}
  .ms-progress-big{
    font-size:10.5px; color:var(--gold-deep); font-weight:900;
    background:linear-gradient(180deg,#fff5d6,#fde9b5);
    padding:4px 11px; border-radius:999px; white-space:nowrap;
    border:1px solid rgba(217,119,6,.25);
    font-variant-numeric:tabular-nums;
  }
  .ms-bar{
    position:relative; height:12px; border-radius:999px; margin-bottom:16px;
    background:linear-gradient(180deg,#efe0c8,#f5ead6);
    box-shadow:0 1px 3px rgba(150,110,70,.15) inset;
  }
  .ms-bar-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg,#fcd34d 0%,#fb923c 55%,#f43f5e 100%);
    transition:width .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px rgba(251,146,60,.5);
  }
  .ms-node-mark{
    position:absolute; top:-4px; width:2px; height:20px;
    background:rgba(90,74,56,.45); border-radius:2px;
    transform:translateX(-1px); pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.55);
  }
  .ms-slider-wrap{display:flex; align-items:center; gap:12px; margin-bottom:12px}
  .ms-slider{
    -webkit-appearance:none; appearance:none; flex:1; height:8px;
    border-radius:999px;
    background:linear-gradient(90deg,#fbbf24 var(--p,0%), #efe0c8 var(--p,0%));
    outline:none; padding:0; border:none; cursor:pointer; min-width:70px;
    box-shadow:0 1px 2px rgba(150,110,70,.15) inset;
  }
  .ms-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:linear-gradient(180deg,#fde68a,#e8940a);
    border:3px solid #fff; cursor:grab;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 3px 10px -1px rgba(232,148,10,.55);
  }
  .ms-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
  .ms-slider::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;

    box-shadow:0 4px 10px -3px rgba(245,158,11,.6);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="avatar">🌅</div>
    <div class="brand-text">
      <div class="brand-name">人生<em>RPG</em></div>
      <div class="brand-sub">LIFE QUEST</div>
    </div>
  </div>
  <div class="player">
    <div class="level-badge" id="levelBadge">Lv.1</div>
    <div class="xp-wrap">
      <div class="xp-label"><span>Experience</span><span id="xpText">0 / 1000</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <div class="coins">🪙 <span id="coinText">0</span></div>
    <button class="stat-edit-btn" onclick="openStatEditor()" title="编辑属性">✎</button>

</header>

<main>
  <div class="col">
    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">今日任务</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="taskName" placeholder="输入任务..." style="flex:1; min-width:130px">
        <input id="taskXP" type="number" value="30" min="1" style="width:62px" title="XP">
        <input id="taskCoins" type="number" value="5" min="0" style="width:62px" title="金币">
        <button class="btn-primary" onclick="addTask()">+ 添加</button>
      </div>
      <div id="taskList"></div>
      <div class="sub" id="taskSummary"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">每日打卡</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="checkinName" placeholder="打卡任务..." style="flex:1; min-width:120px">
        <input id="checkinXP" type="number" value="5" min="0" style="width:62px" title="XP">
        <input id="checkinCoins" type="number" value="2" min="0" style="width:62px" title="金币">
        <button class="btn-primary" onclick="addCheckin()">+ 添加</button>
      </div>
      <div id="checkinList"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">里程碑</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="msName" placeholder="里程碑名称..." style="flex:1; min-width:130px">
        <button class="btn-primary" onclick="addMilestone()">+ 创建</button>
      </div>
      <div id="msList"></div>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">奖励商店</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="rewardName" placeholder="奖励名..." style="flex:1; min-width:100px">
        <input id="rewardCost" type="number" value="50" min="1" style="width:62px" title="金币">
        <button class="btn-pink" onclick="addReward()">+ 添加</button>
      </div>
      <div id="rewardList"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">条件宝箱</span></span></h2>
      <div class="row" style="margin-bottom:7px">
        <input id="chestName" placeholder="宝箱名..." style="flex:1; min-width:100px">
        <select id="chestType" style="flex:1; min-width:120px">
          <option value="todayTasks">今日任务数 ≥</option>
          <option value="todayXP">今日 XP ≥</option>
          <option value="weekTasks">本周任务数 ≥</option>
          <option value="todayCheckins">今日打卡数 ≥</option>
          <option value="manual">手动开启</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:12px">
        <input id="chestValue" type="number" value="3" min="1" style="width:62px" title="条件">
        <input id="chestCoins" type="number" value="30" min="0" style="width:62px" title="金币">
        <input id="chestXP" type="number" value="20" min="0" style="width:62px" title="XP">
        <button class="btn-gold" onclick="addChest()" style="flex:1">+ 添加宝箱</button>
      </div>
      <div id="chestList"></div>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">惊喜宝箱</span></span></h2>
      <div class="row" style="margin-bottom:7px">
        <input id="spName" placeholder="奖励名..." style="flex:2; min-width:90px">
        <input id="spWeight" type="number" value="10" min="1" style="width:58px" title="权重">
        <input id="spCoins" type="number" value="0" min="0" style="width:56px" title="金币">
        <input id="spXP" type="number" value="0" min="0" style="width:56px" title="XP">
        <button class="btn-pink" onclick="addSurprise()">+</button>
      </div>
      <div id="surpriseList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn-gold" style="flex:1; padding:13px; font-size:13.5px" onclick="drawSurprise()">🎲 开启惊喜宝箱</button>
      </div>
      <div id="lastSurprise"></div>
    </section>

    <section class="panel">
      <h2>
        <span class="h2-left"><span class="h2-deco"></span><span class="h2-text">日志</span></span>
        <span class="h2-actions">
          <button class="btn-gold btn-sm" onclick="openSummary()">📝 今日总结</button>

    </section>
  </div>
</main>

<div class="footer">
  <button class="btn-ghost" onclick="resetDay()">🌅 重置今日</button>
  <button class="btn-ghost" onclick="exportSave()">⬇ 导出</button>
  <button class="btn-ghost" onclick="document.getElementById('importFile').click()">⬆ 导入</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSave(event)">
  <button class="btn-danger" onclick="wipe()">清空数据</button>
</div>

<div class="modal" id="summaryModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📝 今日总结</h3>
      <button onclick="closeSummary()">×</button>
    </div>
    <div class="modal-body" id="summaryContent"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="copySummary()">📋 复制</button>
      <button class="btn-primary" onclick="closeSummary()">关闭</button>
    </div>
  </div>
</div>

<div class="modal" id="statModal">
  <div class="modal-content" style="max-width:420px">
    <div class="modal-header">
      <h3>✎ 编辑属性</h3>
      <button onclick="closeStatEditor()">×</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="stat-field">
          <div class="stat-field-label"><span class="ico lv">★</span>等级 Lv.</div>
          <input id="editLevel" type="number" min="1" style="width:120px">
        </div>
        <div class="stat-field">
          <div class="stat-field-label"><span class="ico xp">✦</span>经验值 XP</div>
          <input id="editXP" type="number" min="0" style="width:120px">
        </div>
        <div class="stat-field">
          <div class="stat-field-label"><span class="ico coin">◈</span>金币</div>
          <input id="editCoins" type="number" min="0" style="width:120px">
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin:16px 0 0;line-height:1.6;font-weight:600">
        XP 每满 1000 会自动换算成 1 级。修改会写入日志，可用 Ctrl+Z 撤回。
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeStatEditor()">取消</button>
      <button class="btn-primary" onclick="saveStatEditor()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'life_rpg_save_v1';
var XP_PER_LEVEL = 1000;
var MAX_UNDO = 60;

function uid(){ return Math.random().toString(36).slice(2,9); }
function dateStr(d){
  d = d || new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function todayStr(){ return dateStr(); }
function getWeekStart(d){
  d = d || new Date();
  var dt = new Date(d);
  var day = dt.getDay();
  var diff = day === 0 ? 6 : day - 1;
  dt.setDate(dt.getDate() - diff);
  return dateStr(dt);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

function defaultState(){
  return {
    level: 1, xp: 0, coins: 0,
    tasks: [
      { id: uid(), name: '深度工作 1 小时', xp: 40, coins: 8, done: false },
      { id: uid(), name: '运动 30 分钟', xp: 30, coins: 6, done: false },
      { id: uid(), name: '阅读 30 分钟', xp: 20, coins: 4, done: false }
    ],
    rewards: [
      { id: uid(), name: '看一集剧', cost: 50 },
      { id: uid(), name: '吃顿好的', cost: 120 }
    ],
    chests: [
      { id: uid(), name: '每日小箱', conditionType: 'todayTasks', conditionValue: 3, rewardCoins: 30, rewardXP: 20 },
      { id: uid(), name: '专注宝箱', conditionType: 'todayXP', conditionValue: 100, rewardCoins: 50, rewardXP: 0 },
      { id: uid(), name: '每周大宝箱', conditionType: 'weekTasks', conditionValue: 15, rewardCoins: 200, rewardXP: 100 }
    ],
    chestClaims: {},
    checkins: [
      { id: uid(), name: '早起', xp: 5, coins: 2, records: {} }
    ],
    milestones: [
      {
        id: uid(), name: '示例：写一本小说', progress: 20,
        nodes: [
          { id: uid(), percent: 0, label: '开始构思' },
          { id: uid(), percent: 20, label: '完成大纲' },
          { id: uid(), percent: 50, label: '完成初稿' },
          { id: uid(), percent: 80, label: '完成修改' },
          { id: uid(), percent: 100, label: '发布' }
        ]
      }
    ],
    surprises: [
      { id: uid(), name: '看一集剧', weight: 30, coins: 0, xp: 0 },
      { id: uid(), name: '大餐一顿', weight: 10, coins: 100, xp: 0 },
      { id: uid(), name: '休息半天', weight: 5, coins: 0, xp: 50 },
      { id: uid(), name: '谢谢参与', weight: 20, coins: 0, xp: 0 }
    ],
    lastSurprise: null,
    dailyStats: {}, dailySummaries: {}, logs: [],
    lastReset: todayStr(),
    stats: {
      todayDate: todayStr(), todayTasksDone: 0, todayXP: 0,
      todayCheckins: 0, weekStart: getWeekStart(), weekTasksDone: 0
    }
  };
}

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    var d = defaultState();
    var merged = Object.assign({}, d, s);
    merged.stats = Object.assign({}, d.stats, s.stats || {});
    merged.chestClaims = s.chestClaims || {};
    merged.dailyStats = s.dailyStats || {};
    merged.dailySummaries = s.dailySummaries || {};
    if(!Array.isArray(merged.chests)) merged.chests = d.chests;
    if(!Array.isArray(merged.tasks)) merged.tasks = d.tasks;
    if(!Array.isArray(merged.rewards)) merged.rewards = d.rewards;
    if(!Array.isArray(merged.checkins)) merged.checkins = d.checkins;
    if(!Array.isArray(merged.milestones)) merged.milestones = d.milestones;
    if(!Array.isArray(merged.surprises)) merged.surprises = d.surprises;

    merged.tasks = merged.tasks.map(function(t){
      return {
        id: t.id || uid(), name: t.name || '任务',
        xp: Math.max(0, t.xp || 0), coins: Math.max(0, t.coins || 0),
        done: !!t.done
      };
    });

    merged.checkins = merged.checkins.map(function(c){
      return {
        id: c.id || uid(), name: c.name || '打卡',
        xp: Math.max(0, c.xp === undefined ? 5 : c.xp),
        coins: Math.max(0, c.coins === undefined ? 2 : c.coins),
        records: c.records || {}
      };
    });

    merged.milestones = merged.milestones.map(function(m){
      var nm = { id: m.id || uid(), name: m.name || '里程碑', progress: 0, nodes: [] };
      if(Array.isArray(m.nodes) && m.nodes.length > 0){
        nm.progress = Math.max(0, Math.min(100, m.progress || 0));
        nm.nodes = m.nodes.map(function(n){
          return {
            id: n.id || uid(),
            percent: Math.max(0, Math.min(100, n.percent || 0)),
            label: n.label || ((n.percent || 0) + '%')
          };
        });
      }else if(Array.isArray(m.items) && m.items.length > 0){
        var sum = 0;
        m.items.forEach(function(it){ sum += (it.percent || 0); });
        nm.progress = Math.round(sum / m.items.length);
        nm.nodes = m.items.map(function(it){
          return {
            id: it.id || uid(),
            percent: Math.max(0, Math.min(100, it.percent || 0)),
            label: it.name || ''
          };
        });
      }
      var has0 = nm.nodes.some(function(n){ return n.percent === 0; });
      var has100 = nm.nodes.some(function(n){ return n.percent === 100; });
      if(!has0) nm.nodes.push({ id: uid(), percent: 0, label: '开始' });
      if(!has100) nm.nodes.push({ id: uid(), percent: 100, label: '完成' });
      nm.nodes.sort(function(a,b){ return a.percent - b.percent; });
      return nm;
    });

    merged.surprises = merged.surprises.map(function(s){
      return {
        id: s.id || uid(), name: s.name || '奖励',
        weight: Math.max(1, s.weight || 1),
        coins: Math.max(0, s.coins || 0), xp: Math.max(0, s.xp || 0)
      };
    });

    delete merged.skills;
    if(!Array.isArray(merged.logs)) merged.logs = [];
    merged.logs = merged.logs.map(function(l){
      return typeof l === 'string' ? { date: todayStr(), time: '', text: l } : l;
    });
    return merged;
  }catch(e){
    return defaultState();
  }
}

var state = load();
var undoStack = [];
var editingTaskId = null;
var editingCheckinId = null;
var pinnedCalendars = new Set();
var calendarView = { year: new Date().getFullYear(), month: new Date().getMonth() };

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function pushUndo(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length > MAX_UNDO) undoStack.shift();
}
function undo(){
  if(undoStack.length === 0){ toast('没有可撤回的操作'); return; }
  state = JSON.parse(undoStack.pop());
  editingTaskId = null; editingCheckinId = null;
  save(); render();
  toast('↩ 已撤回');
}
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault(); undo();
  }
});

function log(text){
  var now = new Date();
  state.logs.unshift({
    date: dateStr(now),
    time: now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
    text: text
  });
  if(state.logs.length > 500) state.logs.length = 500;
}
function bumpDailyStat(key, delta){
  var d = todayStr();
  if(!state.dailyStats[d]) state.dailyStats[d] = { tasksDone: 0, xp: 0, checkins: 0 };
  if(state.dailyStats[d][key] === undefined) state.dailyStats[d][key] = 0;
  state.dailyStats[d][key] = Math.max(0, state.dailyStats[d][key] + delta);
}
function applyXP(amount){
  state.xp += amount;
  if(state.xp < 0) state.xp = 0;
  var lv = 0;
  while(state.xp >= XP_PER_LEVEL){ state.xp -= XP_PER_LEVEL; state.level++; lv++; }
  return lv;
}
function doDailyReset(silent){
  state.tasks.forEach(function(t){ t.done = false; });
  state.lastReset = todayStr();
  state.stats.todayDate = todayStr();
  state.stats.todayTasksDone = 0;
  state.stats.todayXP = 0;
  state.stats.todayCheckins = 0;
  var ws = getWeekStart();
  if(ws !== state.stats.weekStart){
    state.stats.weekStart = ws;
    state.stats.weekTasksDone = 0;
  }
  if(!silent) log('🌅 新的一天，任务已重置');
}
function resetDay(){
  pushUndo(); doDailyReset(false); save(); render();
  toast('新的一天，开始吧！');
}
function checkNewDay(){
  if(state.lastReset !== todayStr()){
    doDailyReset(true);
    log('🌅 新的一天，任务已自动重置');
    save(); render();
  }
}

/* ===== 任务 ===== */
function addTask(){
  var nameEl = document.getElementById('taskName');
  var xpEl = document.getElementById('taskXP');
  var coinsEl = document.getElementById('taskCoins');
  var name = nameEl.value.trim();
  var xp = parseInt(xpEl.value) || 10;
  var coins = parseInt(coinsEl.value) || 0;
  if(!name){ toast('请输入任务名'); return; }
  pushUndo();
  state.tasks.push({ id: uid(), name: name, xp: xp, coins: coins, done: false });
  log('➕ 添加任务：' + name + ' (+' + xp + ' XP, +' + coins + ' 金币)');
  nameEl.value = '';
  save(); render();
}
function toggleTask(id){
  var t = state.tasks.find(function(x){ return x.id === id; });
  if(!t) return;
  pushUndo();
  if(!t.done){
    t.done = true;
    state.stats.todayTasksDone++;
    state.stats.weekTasksDone++;
    state.stats.todayXP += t.xp;
    bumpDailyStat('tasksDone', 1);
    bumpDailyStat('xp', t.xp);
    var lv = applyXP(t.xp);
    state.coins += t.coins;
    log('✅ 完成：' + t.name + ' (+' + t.xp + ' XP, +' + t.coins + ' 金币)');
    if(lv > 0) log('🎉 升级！Lv.' + state.level);
    toast('✅ ' + t.name + ' +' + t.xp + ' XP +' + t.coins + ' 金币');
  }else{
    t.done = false;
    state.stats.todayTasksDone = Math.max(0, state.stats.todayTasksDone - 1);
    state.stats.weekTasksDone = Math.max(0, state.stats.weekTasksDone - 1);
    state.stats.todayXP = Math.max(0, state.stats.todayXP - t.xp);
    bumpDailyStat('tasksDone', -1);
    bumpDailyStat('xp', -t.xp);
    applyXP(-t.xp);
    state.coins = Math.max(0, state.coins - t.coins);
    log('↩ 取消完成：' + t.name);
  }
  save(); render();
}
function delTask(id){
  var t = state.tasks.find(function(x){ return x.id === id; });
  if(!t) return;
  pushUndo();
  state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
  log('🗑 删除任务：' + t.name);
  save(); render();
}
function startEditTask(id){ editingTaskId = id; render(); }
function cancelEditTask(){ editingTaskId = null; render(); }
function saveEditTask(id){
  var t = state.tasks.find(function(x){ return x.id === id; });
  if(!t){ editingTaskId = null; render(); return; }
  var nameEl = document.getElementById('et-name-' + id);
  var xpEl = document.getElementById('et-xp-' + id);
  var coinsEl = document.getElementById('et-coins-' + id);
  var newName = (nameEl ? nameEl.value : '').trim();
  if(!newName){ toast('任务名不能为空'); return; }
  pushUndo();
  t.name = newName;
  t.xp = Math.max(0, parseInt(xpEl.value) || 0);
  t.coins = Math.max(0, parseInt(coinsEl.value) || 0);
  log('✏ 编辑任务：' + t.name);
  editingTaskId = null;
  save(); render();
}

/* ===== 打卡 ===== */
function addCheckin(){
  var nameEl = document.getElementById('checkinName');
  var xpEl = document.getElementById('checkinXP');
  var coinsEl = document.getElementById('checkinCoins');
  var name = nameEl.value.trim();
  var xp = parseInt(xpEl.value) || 0;
  var coins = parseInt(coinsEl.value) || 0;
  if(!name){ toast('请输入打卡名'); return; }
  pushUndo();
  state.checkins.push({ id: uid(), name: name, xp: xp, coins: coins, records: {} });
  log('➕ 添加打卡：' + name);
  nameEl.value = '';
  save(); render();
}
function delCheckin(id){
  var c = state.checkins.find(function(x){ return x.id === id; });
  if(!c) return;
  pushUndo();
  state.checkins = state.checkins.filter(function(x){ return x.id !== id; });
  pinnedCalendars.delete(id);
  log('🗑 删除打卡：' + c.name);
  save(); render();
}
function toggleCheckin(id, dateKey){
  var c = state.checkins.find(function(x){ return x.id === id; });
  if(!c) return;
  pushUndo();
  var wasChecked = !!c.records[dateKey];
  if(wasChecked){
    delete c.records[dateKey];
    if(dateKey === todayStr()){
      state.stats.todayCheckins = Math.max(0, state.stats.todayCheckins - 1);
      bumpDailyStat('checkins', -1);
      applyXP(-c.xp);
      state.coins = Math.max(0, state.coins - c.coins);
    }
    log('↩ 取消打卡：' + c.name + ' · ' + dateKey);
  }else{
    c.records[dateKey] = true;
    if(dateKey === todayStr()){
      state.stats.todayCheckins++;
      bumpDailyStat('checkins', 1);
      var lv = applyXP(c.xp);
      state.coins += c.coins;
      log('📅 打卡：' + c.name + ' (+' + c.xp + ' XP, +' + c.coins + ' 金币)');
      if(lv > 0) log('🎉 升级！Lv.' + state.level);
      toast('📅 ' + c.name + ' +' + c.xp + ' XP +' + c.coins + ' 金币');
    }else{
      log('📅 补打卡：' + c.name + ' · ' + dateKey);
    }
  }
  save(); render();
}
function countCheckin(c){ return Object.keys(c.records).length; }
function streakCheckin(c){
  var n = 0;
  var d = new Date();
  if(!c.records[dateStr(d)]) d.setDate(d.getDate() - 1);
  while(true){
    var key = dateStr(d);

function unhoverCheckin(id){

}
function pinCheckin(id){
  var cal = document.getElementById('cal-' + id);

    cal.classList.remove('pinned'); cal.classList.remove('show');

function calShiftMonth(delta){

function addMsNode(msId){
  var m = state.milestones.find(function(x){ return x.id === msId; });
  if(!m) return;
  var pctEl = document.getElementById('ms-np-' + msId);
  var lblEl = document.getElementById('ms-nl-' + msId);
  if(!pctEl || !lblEl) return;
  var pct = Math.max(0, Math.min(100, parseInt(pctEl.value) || 0));
  var label = (lblEl.value || '').trim() || (pct + '%');
  if(m.nodes.some(function(n){ return n.percent === pct; })){
    if(!confirm(pct + '% 已存在，是否覆盖？')) return;
    m.nodes = m.nodes.filter(function(n){ return n.percent !== pct; });
  }
  pushUndo();
  m.nodes.push({ id: uid(), percent: pct, label: label });
  m.nodes.sort(function(a,b){ return a.percent - b.percent; });
  log('➕ 节点：' + pct + '% · ' + label);
  pctEl.value = ''; lblEl.value = '';
  save(); render();
}
function delMsNode(msId, nodeId){
  var m = state.milestones.find(function(x){ return x.id === msId; });
  if(!m) return;
  pushUndo();
  m.nodes = m.nodes.filter(function(x){ return x.id !== nodeId; });
  save(); render();
}
function currentMsNode(m){
  var sorted = m.nodes.slice().sort(function(a,b){ return a.percent - b.percent; });
  var cur = null;
  for(var i = 0; i < sorted.length; i++){
    if(m.progress >= sorted[i].percent) cur = sorted[i];
    else break;
  }
  return cur;
}
function updateMsProgress(msId, value){
  var m = state.milestones.find(function(x){ return x.id === msId; });
  if(!m) return;
  m.progress = Math.max(0, Math.min(100, parseInt(value) || 0));
  var wrap = document.querySelector('.ms[data-id="' + msId + '"]');
  if(!wrap) return;
  var cur = currentMsNode(m);
  var big = wrap.querySelector('.ms-progress-big');
  var pct = wrap.querySelector('.ms-pct-big');
  var bar = wrap.querySelector('.ms-bar-fill');
  var slider = wrap.querySelector('.ms-slider');
  if(big) big.textContent = m.progress + '% · ' + (cur ? cur.label : '未开始');
  if(pct) pct.textContent = m.progress + '%';
  if(bar) bar.style.width = m.progress + '%';
  if(slider) slider.style.setProperty('--p', m.progress + '%');
  wrap.querySelectorAll('.ms-node-tag').forEach(function(el){
    el.classList.toggle('active', cur && el.dataset.nodeid === cur.id);
  });
}
function finishMsProgress(msId){
  var m = state.milestones.find(function(x){ return x.id === msId; });

  log('🎯 里程碑「' + m.name + '」 → ' + m.progress + '%');
  save(); render();
}

function drawSurprise(){
  if(state.surprises.length === 0) return toast('还没有惊喜奖励');
  var total = 0;
  state.surprises.forEach(function(s){ total += Math.max(1, s.weight || 1); });
  var roll = Math.random() * total;
  var picked = state.surprises[state.surprises.length - 1];
  for(var i = 0; i < state.surprises.length; i++){
    var s = state.surprises[i];
    roll -= Math.max(1, s.weight || 1);
    if(roll <= 0){ picked = s; break; }
  }
  pushUndo();
  var parts = [];
  if(picked.coins > 0){ state.coins += picked.coins; parts.push('🪙 +' + picked.coins); }
  var lv = 0;
  if(picked.xp > 0){ lv = applyXP(picked.xp); parts.push('+' + picked.xp + ' XP'); }
  var rewardText = parts.join(' · ') || '（无金币/XP，但也是惊喜）';
  state.lastSurprise = {
    name: picked.name, rewardText: rewardText,
    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  };
  log('🎊 惊喜宝箱抽中：「' + picked.name + '」 ' + rewardText);
  if(lv > 0) log('🎉 升级！Lv.' + state.level);
  save(); render();
  toast('🎊 抽中：' + picked.name + '！');
}

function buildCalendar(c){
  var y = calendarView.year, m = calendarView.month;
  var firstDay = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var weekLabels = ['一','二','三','四','五','六','日'];
  var html = '<div class="cal-head">';
  html += '<button class="btn-ghost btn-sm" onclick="event.stopPropagation();calShiftMonth(-1)">◀</button>';
  html += '<span>' + y + ' 年 ' + (m + 1) + ' 月</span>';
  html += '<button class="btn-ghost btn-sm" onclick="event.stopPropagation();calShiftMonth(1)">▶</button>';
  html += '</div><div class="cal-grid">';
  weekLabels.forEach(function(w){ html += '<div class="cal-w">' + w + '</div>'; });
  var startOffset = firstDay === 0 ? 6 : firstDay - 1;
  for(var i = 0; i < startOffset; i++) html += '<div class="cal-day empty"></div>';
  var todayKey = todayStr();
  for(var d = 1; d <= daysInMonth; d++){
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var checked = c.records[ds];
    var isToday = ds === todayKey;
    var cls = 'cal-day';
    if(checked) cls += ' checked';
    if(isToday) cls += ' today';
    html += '<div class="' + cls + '" onclick="event.stopPropagation();toggleCheckin(\'' + c.id + '\',\'' + ds + '\')">' + d + '</div>';
  }
  html += '</div>';
  return html;
}

    html += '<input id="ms-np-' + m.id + '" type="number" min="0" max="100" placeholder="%" style="width:62px">';
    html += '<input id="ms-nl-' + m.id + '" placeholder="节点名称" style="flex:1; min-width:100px" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addMsNode(\'' + m.id + '\')}">';
    html += '<button class="btn-ghost btn-sm" onclick="addMsNode(\'' + m.id + '\')">+ 节点</button>';
    html += '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderRewards(){
  var el = document.getElementById('rewardList');
  if(state.rewards.length === 0){

  }

    html += '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderChests(){
  var el = document.getElementById('chestList');
  if(state.chests.length === 0){
    el.innerHTML = '<div class="empty">还没有宝箱</div>';
    return;
  }
  var html = '';
  state.chests.forEach(function(c){
    var ready = checkChest(c);
    var claimed = state.chestClaims[c.id] === todayStr();
    var canOpen = ready && !claimed;
    var btn;
    if(claimed) btn = '<button class="btn-ghost btn-sm" disabled>已开</button>';
    else if(canOpen) btn = '<button class="btn-gold btn-sm" onclick="openChest(\'' + c.id + '\')">开启</button>';
    else btn = '<button class="btn-ghost btn-sm" disabled>未达成</button>';

    html += '<div class="chest-icon">' + (canOpen ? '🎁' : '📦') + '</div>';
    html += '<div class="info">';
    html += '<div class="cname">' + escapeHtml(c.name) + '</div>';
    html += '<div class="cond">' + chestConditionText(c) + ' · ' + chestProgress(c) + '</div>';
    html += '<div class="rw">' + chestRewardText(c) + '</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:4px;flex-shrink:0">';
    html += btn;
    html += '<button class="btn-danger btn-sm" onclick="delChest(\'' + c.id + '\')">删</button>';
    html += '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderSurprises(){
  var el = document.getElementById('surpriseList');
  if(state.surprises.length === 0){
    el.innerHTML = '<div class="empty">还没有惊喜奖励</div>';
  }else{

    last.innerHTML = '<div class="last-surprise">' +
      '<span class="lbl">上次抽中 · ' + state.lastSurprise.time + '</span>' +
      '<div style="font-size:16px;font-weight:900;color:#be185d">🎊 ' + escapeHtml(state.lastSurprise.name) + '</div>' +
      '<div style="font-size:11.5px;color:var(--ink-2);margin-top:6px;font-weight:700">' + escapeHtml(state.lastSurprise.rewardText) + '</div>' +
      '</div>';

    last.innerHTML = '';

}

function renderLogs(){
  var el = document.getElementById('log');
  if(!state.logs || state.logs.length === 0){
    el.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }
  var groups = {};
  state.logs.forEach(function(l){
    var d = l.date || todayStr();
    if(!groups[d]) groups[d] = [];
    groups[d].push(l);
  });
  var dates = Object.keys(groups).sort().reverse();
  var today = todayStr();
  var html = '';
  dates.forEach(function(d){
    var isToday = (d === today);
    var label = isToday ? ('今天 · ' + d) : d;
    var items = '';
    groups[d].forEach(function(l){
      items += '<div class="log-item">' + (l.time ? '[' + l.time + '] ' : '') + escapeHtml(l.text) + '</div>';
    });
    html += '<div class="log-folder ' + (isToday ? 'open' : '') + '" data-date="' + d + '">';
    html += '<div class="folder-head" onclick="toggleFolder(\'' + d + '\')">';
    html += '<span class="tri">' + (isToday ? '▼' : '▶') + '</span>';
    html += '<span>' + (isToday ? '📂' : '📁') + ' ' + label + ' · ' + groups[d].length + '</span>';
    html += '</div>';
    html += '<div class="folder-body ' + (isToday ? '' : 'hidden') + '">' + items + '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}
function toggleFolder(date){
  var folder = document.querySelector('.log-folder[data-date="' + date + '"]');
  if(!folder) return;
  var body = folder.querySelector('.folder-body');
  var tri = folder.querySelector('.tri');
  var isOpen = folder.classList.toggle('open');
  body.classList.toggle('hidden', !isOpen);
  tri.textContent = isOpen ? '▼' : '▶';
}

/* ===== 总结 ===== */
function computeSummaryData(){
  var today = todayStr();
  var s = state.stats;
  var doneTasks = state.tasks.filter(function(t){ return t.done; });
  var undoneTasks = state.tasks.filter(function(t){ return !t.done; });
  var totalTasks = state.tasks.length;
  var completionRate = totalTasks > 0 ? Math.round(doneTasks.length / totalTasks * 100) : 0;
  var todayCheckins = state.checkins.filter(function(c){ return c.records[today]; }).length;
  var totalCheckinTasks = state.checkins.length;
  var yd = dateStr(new Date(Date.now() - 86400000));
  var yStats = state.dailyStats[yd] || { tasksDone: 0, xp: 0, checkins: 0 };
  var ws = state.stats.weekStart;
  var weekXP = 0, weekDays = 0;
  Object.keys(state.dailyStats).forEach(function(d){
    if(d >= ws && d < today){
      weekXP += state.dailyStats[d].xp || 0;
      weekDays++;
    }
  });
  var avgXP = weekDays > 0 ? Math.round(weekXP / weekDays) : 0;
  return {
    today: today, s: s, doneTasks: doneTasks, undoneTasks: undoneTasks,
    totalTasks: totalTasks, completionRate: completionRate,
    todayCheckins: todayCheckins, totalCheckinTasks: totalCheckinTasks,
    yStats: yStats, avgXP: avgXP
  };
}

function summaryHTML(){
  var d = computeSummaryData();
  var today = d.today, s = d.s, doneTasks = d.doneTasks, undoneTasks = d.undoneTasks;
  var totalTasks = d.totalTasks, completionRate = d.completionRate;
  var todayCheckins = d.todayCheckins, totalCheckinTasks = d.totalCheckinTasks;
  var yStats = d.yStats, avgXP = d.avgXP;

  var hour = new Date().getHours();
  var greeting = hour < 6 ? '夜深了 🌙' : hour < 12 ? '早上好 ☀️' : hour < 18 ? '下午好 🌤' : '晚上好 🌆';
  var dateReadable = today.replace(/-/g, ' / ');
  var ringColor = completionRate >= 80 ? '#10b981' : completionRate >= 50 ? '#f59e0b' : '#f43f5e';
  var maxXP = Math.max(s.todayXP, yStats.xp || 0, avgXP, 1);
  var todayPct = Math.round(s.todayXP / maxXP * 100);
  var yPct = Math.round((yStats.xp || 0) / maxXP * 100);
  var avgPct = Math.round(avgXP / maxXP * 100);
  var diffXP = s.todayXP - (yStats.xp || 0);
  var diffClass = diffXP > 0 ? 'up' : diffXP < 0 ? 'down' : '';
  var diffText = diffXP > 0 ? ('↑ 比昨天多 ' + diffXP) : diffXP < 0 ? ('↓ 比昨天少 ' + Math.abs(diffXP)) : '与昨天持平';

  var html = '';

  html += '<div class="sum-greeting"><div class="date">' + dateReadable + '</div><div class="hi">' + greeting + '</div></div>';

  html += '<div class="sum-visuals">';
  html += '<div class="sv-card"><div class="ring" style="background:conic-gradient(' + ringColor + ' 0% ' + completionRate + '%, #efe0c8 ' + completionRate + '% 100%)"><div class="ring-inner"><span>' + completionRate + '%</span></div></div><div class="sv-label">完成率</div><div class="sv-sub">' + doneTasks.length + ' / ' + totalTasks + '</div></div>';
  html += '<div class="sv-card"><div class="sv-num">' + s.todayXP + '</div><div class="sv-label">今日 XP</div><div class="sv-sub ' + diffClass + '">' + diffText + '</div></div>';
  html += '<div class="sv-card"><div class="sv-num">' + todayCheckins + '<span style="font-size:13px;color:var(--muted)">/' + totalCheckinTasks + '</span></div><div class="sv-label">今日打卡</div><div class="sv-sub">' + (totalCheckinTasks > 0 ? (todayCheckins === totalCheckinTasks ? '全部完成 ✨' : '继续加油') : '还没有打卡') + '</div></div>';
  html += '<div class="sv-card"><div class="sv-num">' + avgXP + '</div><div class="sv-label">本周日均</div><div class="sv-sub">' + (s.todayXP > avgXP ? '↑ 高于平均' : s.todayXP < avgXP ? '↓ 低于平均' : '与平均持平') + '</div></div>';
  html += '</div>';

  html += '<div class="compare-chart"><div class="cc-title">XP 对比</div>';
  html += '<div class="bar-row"><span class="bar-label">昨天</span><div class="bar-track"><div class="bar-fill" style="width:' + yPct + '%;background:linear-gradient(90deg,#fde68a,#fcd34d)"></div></div><span class="bar-val">' + (yStats.xp || 0) + '</span></div>';
  html += '<div class="bar-row"><span class="bar-label">今天</span><div class="bar-track"><div class="bar-fill" style="width:' + todayPct + '%;background:linear-gradient(90deg,#fbbf24,#f59e0b)"></div></div><span class="bar-val">' + s.todayXP + '</span></div>';
  html += '<div class="bar-row"><span class="bar-label">周均</span><div class="bar-track"><div class="bar-fill" style="width:' + avgPct + '%;background:linear-gradient(90deg,#c4b5fd,#a78bfa)"></div></div><span class="bar-val">' + avgXP + '</span></div>';
  html += '</div>';

  if(state.checkins.length > 0){
    html += '<div class="checkin-dots"><div class="cd-title">今日打卡</div>';
    state.checkins.forEach(function(c){
      var on = !!c.records[today];
      var st = streakCheckin(c);
      html += '<div class="dot-row"><div class="dot ' + (on ? 'on' : '') + '">' + (on ? '✓' : '') + '</div><div class="dr-name">' + escapeHtml(c.name) + '</div><div class="dr-streak">' + (st > 0 ? ('连续 ' + st + ' 天') : '未开始') + '</div></div>';
    });
    html += '</div>';
  }

  if(state.milestones.length > 0){
    html += '<div class="milestones-mini"><div class="mm-title">里程碑</div>';
    state.milestones.forEach(function(m){
      var cur = currentMsNode(m);
      html += '<div class="ms-mini"><div class="ms-mini-head"><div class="name">' + escapeHtml(m.name) + '<span class="cur">' + (cur ? escapeHtml(cur.label) : '') + '</span></div><div class="pct">' + m.progress + '%</div></div><div class="ms-mini-bar"><div style="width:' + m.progress + '%"></div></div></div>';
    });
    html += '</div>';
  }

  html += '<div class="sum-block"><div class="bk-title">今天发生了什么</div>';
  if(totalTasks === 0){
    html += '<p>今天还没有设置任务。没有目标的一天也是允许的。</p>';
  }else if(doneTasks.length === 0){
    html += '<p>今天设了 <b>' + totalTasks + '</b> 个任务，但一个都还没完成。</p>';
    html += '<p>没关系，明天把目标缩小一点，小到"你肯定能做到"。</p>';
  }else{
    html += '<p>今天完成了 <b>' + doneTasks.length + '/' + totalTasks + '</b> 个任务，拿到 <b>' + s.todayXP + ' XP</b>。</p>';
    if(completionRate === 100) html += '<p>✨ 全部完成！执行力值得被看见。</p>';
    else if(completionRate >= 70) html += '<p>完成率 <b>' + completionRate + '%</b>，很稳。</p>';
    else if(completionRate >= 40) html += '<p>完成率 <b>' + completionRate + '%</b>，还有空间。明天挑最重要的先做。</p>';
    else html += '<p>完成率 <b>' + completionRate + '%</b>，今天状态一般。明天重新出发。</p>';
  }
  html += '</div>';

  if(doneTasks.length > 0){
    html += '<div class="sum-block"><div class="bk-title">已完成</div><ul class="sum-list">';
    doneTasks.forEach(function(t){
      html += '<li class="done">' + escapeHtml(t.name) + '<span class="xp-tag">+' + t.xp + ' XP</span></li>';
    });
    html += '</ul></div>';
  }

  if(undoneTasks.length > 0){
    html += '<div class="sum-block"><div class="bk-title">待完成</div><ul class="sum-list">';
    undoneTasks.forEach(function(t){
      html += '<li class="todo">' + escapeHtml(t.name) + '<span class="xp-tag">' + t.xp + ' XP</span></li>';
    });
    html += '</ul></div>';
  }

  var critiques = [];
  if(totalTasks > 0 && doneTasks.length < totalTasks * 0.5){
    critiques.push('今天任务完成率偏低。可能任务设得太多，明天试着只留 3 个。');
  }
  if(s.todayXP > 0 && s.todayXP < 50 && doneTasks.length > 0){
    critiques.push('今天 XP 收获不多。可以挑一段 25 分钟完全无干扰的专注时间试试。');
  }
  if(undoneTasks.some(function(t){ return t.xp >= 60; })){
    critiques.push('高价值任务还没动，明天优先安排它们在精力最好的时段。');
  }
  if(totalCheckinTasks > 0 && todayCheckins === 0){
    critiques.push('今天打卡一项都没完成。明天先做 1 项把链条接上。');
  }
  if(critiques.length > 0){
    html += '<div class="tip-box"><div class="tb-title">🌱 温和的提醒</div>';
    critiques.forEach(function(c){ html += '<p>· ' + escapeHtml(c) + '</p>'; });
    html += '</div>';
  }

  var praises = [];
  if(doneTasks.length > 0) praises.push('你今天迈出了实实在在的步伐，值得肯定。');
  if(s.todayXP >= 100) praises.push('今天 ' + s.todayXP + ' XP，高效的一天，记住这种感觉。');
  if(todayCheckins > 0) praises.push('打卡 ' + todayCheckins + ' 项，习惯正在悄悄成形。');
  if(doneTasks.length >= 3) praises.push('一口气完成 ' + doneTasks.length + ' 个任务，很稳。');
  if(avgXP > 0 && s.todayXP > avgXP) praises.push('今天超过本周平均水平，进步看得见。');
  if(praises.length === 0) praises.push('哪怕今天只完成了一件小事，也是在前进。');
  html += '<div class="warm-box"><div class="wb-title">💛 给你的话</div>';
  praises.forEach(function(p){ html += '<p>· ' + escapeHtml(p) + '</p>'; });
  html += '</div>';

  var tomorrowText;
  if(undoneTasks.length > 0){
    var first = undoneTasks.slice().sort(function(a,b){ return b.xp - a.xp; })[0];
    tomorrowText = '明天先做「' + first.name + '」，完成它你就赢了一半。';
  }else if(totalTasks === 0){
    tomorrowText = '明天早上，先写下 1 件非做不可的小事。';
  }else{
    tomorrowText = '今天全部清空，明天可以稍微加点难度，或给自己留半天休息。';
  }
  html += '<div class="tomorrow-box"><div class="tb-label">🌅 给明天的一句话</div><div class="tb-text">' + escapeHtml(tomorrowText) + '</div></div>';
  html += '<div class="well-done">晚安，明天见 🌙</div>';

  return html;
}

function openSummary(){
  if(!state.dailySummaries) state.dailySummaries = {};
  state.dailySummaries[todayStr()] = 'summary';
  log('📝 生成今日总结');
  save();
  document.getElementById('summaryContent').innerHTML = summaryHTML();
  document.getElementById('summaryModal').classList.add('show');
  render();
}
function closeSummary(){
  document.getElementById('summaryModal').classList.remove('show');
}
function copySummary(){
  var el = document.getElementById('summaryContent');
  var text = el ? el.innerText : '';
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast('已复制'); });
  }else{
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制');
  }
}
document.getElementById('summaryModal').addEventListener('click', function(e){
  if(e.target.id === 'summaryModal') closeSummary();
});

/* ===== 属性编辑器 ===== */
function openStatEditor(){
  document.getElementById('editLevel').value = state.level;
  document.getElementById('editXP').value = state.xp;
  document.getElementById('editCoins').value = state.coins;
  document.getElementById('statModal').classList.add('show');
}
function closeStatEditor(){
  document.getElementById('statModal').classList.remove('show');
}
function saveStatEditor(){
  var newLevel = Math.max(1, parseInt(document.getElementById('editLevel').value) || 1);
  var newXP = Math.max(0, parseInt(document.getElementById('editXP').value) || 0);
  var newCoins = Math.max(0, parseInt(document.getElementById('editCoins').value) || 0);
  pushUndo();
  var oldLevel = state.level, oldXP = state.xp, oldCoins = state.coins;
  state.level = newLevel;
  state.xp = newXP;
  state.coins = newCoins;
  while(state.xp >= XP_PER_LEVEL){
    state.xp -= XP_PER_LEVEL;
    state.level++;
  }
  log('✎ 修改属性：Lv.' + oldLevel + '→' + state.level + '，XP ' + oldXP + '→' + state.xp + '，金币 ' + oldCoins + '→' + state.coins);
  closeStatEditor();
  save(); render();
  toast('属性已更新');
}
document.getElementById('statModal').addEventListener('click', function(e){
  if(e.target.id === 'statModal') closeStatEditor();
});

/* ===== Toast ===== */
var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ===== 存档 ===== */
function exportSave(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'life-rpg-save-' + todayStr() + '.json';
  a.click();
  toast('已导出');
}
function importSave(e){
  var f = e.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var raw = JSON.parse(ev.target.result);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(raw));
      undoStack = [];
      editingTaskId = null; editingCheckinId = null;
      pinnedCalendars.clear();
      state = load();
      save(); render();
      toast('已导入');
    }catch(err){ toast('导入失败'); }
  };
  reader.readAsText(f);
  e.target.value = '';
}
function wipe(){
  if(!confirm('确定清空所有数据？')) return;
  localStorage.removeItem(STORAGE_KEY);
  undoStack = [];
  editingTaskId = null; editingCheckinId = null;
  pinnedCalendars.clear();
  state = defaultState();
  save(); render();
  toast('已重置');
}

/* ===== 启动 ===== */
checkNewDay();
setInterval(checkNewDay, 60000);
render();
</script>
