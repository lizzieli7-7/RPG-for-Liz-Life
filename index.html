<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生RPG</title>
<style>
  :root{
    --bg-1:#faf6f0; --bg-2:#f3ece0; --bg-3:#ebe0cf;
    --card:#ffffff; --card-2:#fdfbf7; --card-3:#f8f4ec;
    --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-200:#fde68a; --amber-300:#fcd34d;
    --amber-400:#fbbf24; --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309; --amber-800:#92400e;
    --rose-50:#fff1f2; --rose-400:#fb7185; --rose-500:#f43f5e; --rose-700:#be123c;
    --ink-900:#1c1917; --ink-700:#44403c; --ink-600:#57534e; --ink-500:#78716c; --ink-400:#a8a29e; --ink-300:#d6d3d1;
    --line-1:#ebe4d8; --line-2:#f1ebdf;
    --green:#059669; --green-2:#10b981; --green-bg:#ecfdf5;
    --red:#dc2626; --red-bg:#fef2f2; --blue-bg:#eff6ff;
    --sh-xs:0 1px 2px rgba(120,80,40,.06);
    --sh-sm:0 1px 3px rgba(120,80,40,.06), 0 1px 2px rgba(120,80,40,.04);
    --sh:0 4px 14px -6px rgba(120,80,40,.12), 0 1px 2px rgba(120,80,40,.05);
    --sh-lg:0 20px 48px -18px rgba(120,80,40,.28);
    --sh-glow:0 0 0 3px rgba(217,119,6,.15);
    --r-sm:10px; --r:12px; --r-md:16px; --r-lg:20px; --r-xl:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-feature-settings:"tnum";
    background:
      radial-gradient(1200px 600px at 8% -10%, rgba(251,191,36,.14), transparent 60%),
      radial-gradient(1000px 500px at 96% 6%, rgba(244,114,182,.07), transparent 62%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment:fixed;
    color:var(--ink-900); min-height:100vh; font-size:14px;
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.22;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  #authScreen{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(900px 600px at 20% 10%, rgba(251,191,36,.16), transparent 60%),
    radial-gradient(900px 600px at 80% 90%, rgba(244,114,182,.1), transparent 60%),
    linear-gradient(180deg,#faf6f0,#ebe0cf);}
  .auth-card{width:100%; max-width:400px; background:linear-gradient(180deg,#ffffff,#fdfbf7); border:1px solid var(--line-1); border-radius:var(--r-xl); padding:36px 30px 28px; box-shadow:var(--sh-lg);}
  .auth-logo{display:flex; align-items:center; gap:12px; margin-bottom:28px; justify-content:center}
  .auth-logo .icon{width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,#fbbf24 0%,#d97706 100%); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 8px 20px -8px rgba(217,119,6,.6), inset 0 1px 0 rgba(255,255,255,.4);}
  .auth-logo .txt{font-size:21px; font-weight:800; color:var(--ink-900)}
  .auth-logo .txt em{font-style:normal; background:linear-gradient(135deg,#d97706,#b45309); -webkit-background-clip:text; background-clip:text; color:transparent}
  .auth-tabs{display:flex; gap:4px; margin-bottom:22px; background:var(--card-3); padding:4px; border-radius:12px; border:1px solid var(--line-1)}
  .auth-tabs button{flex:1; padding:9px; border:none; border-radius:9px; background:transparent; font-weight:700; font-size:13px; color:var(--ink-500); cursor:pointer; transition:.18s; box-shadow:none}
  .auth-tabs button.active{background:#fff; color:var(--ink-900); box-shadow:var(--sh-sm)}
  .auth-field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
  .auth-field label{font-size:11px; font-weight:700; color:var(--ink-500); letter-spacing:.1em; text-transform:uppercase}
  .auth-field input{width:100%; font-size:14px; padding:11px 14px; border-radius:11px; border:1.5px solid var(--line-1); background:#fff; outline:none; transition:.18s; color:var(--ink-900)}
  .auth-field input:focus{border-color:var(--amber-500); box-shadow:var(--sh-glow)}
  .auth-btn{width:100%; padding:13px; margin-top:8px; border:none; border-radius:12px; font-weight:800; font-size:14px; color:#fff; cursor:pointer; background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%); text-shadow:0 1px 1px rgba(120,60,0,.25); box-shadow:0 6px 16px -6px rgba(217,119,6,.5), inset 0 1px 0 rgba(255,255,255,.25); transition:.2s;}
  .auth-btn:hover{transform:translateY(-1px)}
  .auth-btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
  .auth-msg{margin-top:14px; padding:11px 14px; border-radius:10px; font-size:12.5px; line-height:1.6; font-weight:500; display:none}
  .auth-msg.show{display:block}
  .auth-msg.ok{background:var(--green-bg); color:#065f46; border:1px solid #a7f3d0}
  .auth-msg.err{background:var(--red-bg); color:#991b1b; border:1px solid #fecaca}
  .auth-hint{text-align:center; font-size:11px; color:var(--ink-400); margin-top:20px; line-height:1.7}
  #appScreen{display:none}
  #appScreen.show{display:block}
  header{padding:14px 26px; position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; background:rgba(250,246,240,.88); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line-1);}
  .brand{display:flex; align-items:center; gap:11px}
  .avatar{width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,#fbbf24 0%,#d97706 100%); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; box-shadow:0 6px 14px -5px rgba(217,119,6,.5), inset 0 1px 0 rgba(255,255,255,.4)}
  .brand-text{display:flex; flex-direction:column; gap:1px}
  .brand-name{font-size:17px; font-weight:800; color:var(--ink-900); line-height:1.15}
  .brand-name em{font-style:normal; background:linear-gradient(135deg,#d97706,#b45309); -webkit-background-clip:text; background-clip:text; color:transparent}
  .brand-sub{font-size:9px; font-weight:700; color:var(--ink-400); letter-spacing:.22em; text-transform:uppercase}
  .player{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .level-badge{display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:linear-gradient(135deg,#fbbf24 0%,#d97706 100%); color:#fff; font-weight:800; font-size:12.5px; box-shadow:0 4px 12px -3px rgba(217,119,6,.55), inset 0 1px 0 rgba(255,255,255,.3)}
  .level-badge::before{content:'★'; font-size:10px; opacity:.9}
  .xp-wrap{min-width:200px}
  .xp-label{display:flex; justify-content:space-between; font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--ink-500); text-transform:uppercase; margin-bottom:5px}
  .xp-label span:last-child{color:var(--amber-700); font-weight:800}
  .xp-bar{height:8px; border-radius:999px; overflow:hidden; background:var(--card-3); border:1px solid var(--line-1)}
  .xp-fill{height:100%; width:0%; background:linear-gradient(90deg,#fbbf24 0%,#f59e0b 50%,#d97706 100%); background-size:200% 100%; transition:width .7s cubic-bezier(.4,0,.2,1); border-radius:999px; box-shadow:0 0 10px rgba(251,146,60,.4); animation:xpFlow 6s linear infinite}
  @keyframes xpFlow{from{background-position:0% 0}to{background-position:200% 0}}
  .coins{display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; background:var(--amber-50); border:1px solid rgba(217,119,6,.25); color:var(--amber-800); font-weight:800; font-size:12.5px; box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .icon-btn{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#fbbf24 0%,#d97706 100%); border:none; color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; flex-shrink:0; box-shadow:0 4px 10px -3px rgba(217,119,6,.5), inset 0 1px 0 rgba(255,255,255,.3); padding:0; font-weight:800}
  .icon-btn:hover{transform:translateY(-1px)}
  .icon-btn.ghost{background:transparent; color:var(--ink-500); border:1.5px solid var(--line-1); box-shadow:none}
  .icon-btn.ghost:hover{background:var(--card-3); color:var(--ink-700); transform:none}
  main{max-width:1480px; margin:0 auto; padding:22px 26px 28px; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:20px; position:relative; z-index:1; align-items:start}
  @media(max-width:1080px){main{grid-template-columns:1fr; gap:16px}}
  @media(max-width:600px){header{padding:12px 14px; gap:12px} main{padding:14px 12px 24px; gap:14px} .brand-name{font-size:15px} .avatar{width:36px;height:36px;font-size:18px;border-radius:10px} .xp-wrap{min-width:140px} .panel{padding:16px}}
  .col{display:flex; flex-direction:column; gap:18px; min-width:0}
  .panel{background:linear-gradient(180deg,#ffffff 0%,#fdfbf7 100%); border:1px solid var(--line-1); border-radius:var(--r-lg); padding:20px 22px; box-shadow:var(--sh-sm); transition:box-shadow .3s; position:relative}
  .panel:hover{box-shadow:var(--sh)}
  .panel h2{font-size:11px; margin:0 0 16px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-500); display:flex; align-items:center; justify-content:space-between; gap:12px}
  .h2-left{display:flex; align-items:center; gap:9px; min-width:0}
  .h2-deco{width:3px; height:12px; border-radius:2px; flex-shrink:0; background:linear-gradient(180deg,#f59e0b,#b45309)}
  .h2-text{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .h2-actions{display:flex; gap:6px; text-transform:none; letter-spacing:0; font-weight:600}
  .row{display:flex; gap:7px; flex-wrap:wrap}
  input,select,button,textarea{font-family:inherit; font-size:12.5px; border-radius:var(--r-sm); border:1.5px solid var(--line-1); background:#fff; color:var(--ink-900); padding:9px 12px; outline:none; transition:.18s;}
  input::placeholder{color:var(--ink-400)}
  input:hover,select:hover{border-color:var(--ink-300)}
  input:focus,select:focus{border-color:var(--amber-500); box-shadow:var(--sh-glow)}
  select option{background:#fff; color:var(--ink-900)}
  button{cursor:pointer; border:1.5px solid var(--line-1); background:#fff; font-weight:700; color:var(--ink-700); transition:.18s; box-shadow:0 1px 2px rgba(120,80,40,.04)}
  button:hover{background:var(--card-3); border-color:var(--ink-300); color:var(--ink-900); transform:translateY(-1px)}
  button:active{transform:translateY(0) scale(.98)}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none !important}
  .btn-primary{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%); border:none; color:#fff; font-weight:800; text-shadow:0 1px 1px rgba(120,60,0,.2); box-shadow:0 4px 10px -3px rgba(217,119,6,.5), inset 0 1px 0 rgba(255,255,255,.25)}
  .btn-primary:hover{background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%)}
  .btn-gold{background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%); border:none; color:#78350f; font-weight:800; box-shadow:0 4px 10px -3px rgba(251,191,36,.55), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-gold:hover{background:linear-gradient(135deg,#fcd34d 0%,#fbbf24 100%)}
  .btn-pink{background:linear-gradient(135deg,#fb7185 0%,#e11d48 100%); border:none; color:#fff; font-weight:800; box-shadow:0 4px 10px -3px rgba(225,29,72,.5), inset 0 1px 0 rgba(255,255,255,.25)}
  .btn-pink:hover{background:linear-gradient(135deg,#f43f5e 0%,#be123c 100%)}
  .btn-ghost{background:transparent; color:var(--ink-500); border-color:transparent; box-shadow:none; font-weight:600}
  .btn-ghost:hover{background:var(--card-3); color:var(--ink-700); transform:none}
  .btn-danger{background:transparent; color:var(--red); border-color:rgba(220,38,38,.2); box-shadow:none}
  .btn-danger:hover{background:var(--red-bg); border-color:rgba(220,38,38,.35); color:#b91c1c}
  .btn-sm{padding:4px 9px !important; font-size:11px !important; border-radius:7px !important}
  .btn-icon{padding:5px 8px !important; font-size:12px !important; line-height:1}
  .task{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:var(--r); margin-bottom:6px; background:#fff; border:1.5px solid var(--line-2); transition:.2s; box-shadow:0 1px 2px rgba(120,80,40,.03)}
  .task:hover{border-color:var(--line-1); box-shadow:var(--sh-xs); transform:translateX(2px)}
  .task.done{opacity:.5; background:var(--card-3)}
  .task.done .name{text-decoration:line-through; text-decoration-color:var(--ink-400); color:var(--ink-500)}
  .task .name{flex:1; font-size:13px; color:var(--ink-900); font-weight:600; min-width:0}
  .tag{font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:800; white-space:nowrap; display:inline-flex; align-items:center; gap:3px}
  .tag.xp{color:var(--amber-800); background:var(--amber-50); border:1px solid rgba(217,119,6,.2)}
  .tag.coin{color:#a16207; background:#fefce8; border:1px solid rgba(234,179,8,.25)}
  .check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--ink-300); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.2s; font-size:11px; color:transparent}
  .check:hover{border-color:var(--amber-500); transform:scale(1.08)}
  .check.on{background:linear-gradient(135deg,#f59e0b,#d97706); border-color:var(--amber-600); color:#fff; font-weight:900; box-shadow:0 2px 6px rgba(217,119,6,.35)}
  .edit-input{flex:1; min-width:70px; padding:6px 10px}
  .edit-num{width:60px; padding:6px 8px}
  .ck{background:#fff; border-radius:var(--r); margin-bottom:8px; border:1.5px solid var(--line-2); transition:.2s; overflow:hidden; box-shadow:0 1px 2px rgba(120,80,40,.03)}
  .ck:hover{border-color:var(--line-1); box-shadow:var(--sh-xs)}
  .ck-row{display:flex; align-items:center; gap:10px; padding:11px 13px}
  .ck-name{flex:1; font-size:12.5px; cursor:help; padding:2px 0; font-weight:700; color:var(--ink-900); min-width:0; transition:.15s}
  .ck-name:hover{color:var(--amber-700)}
  .ck-stats{font-size:10.5px; color:var(--ink-500); font-weight:700; white-space:nowrap; background:var(--card-3); padding:3px 9px; border-radius:999px; border:1px solid var(--line-1)}
  .ck-cal{padding:0 13px 13px; display:none; border-top:1px solid var(--line-2); background:var(--card-2)}
  .ck-cal.show{display:block}
  .ck-cal.pinned{display:block}
  .cal-head{display:flex; align-items:center; justify-content:space-between; padding:11px 0; font-size:12px; color:var(--ink-700); font-weight:800}
  .cal-head button{padding:3px 9px; font-size:11px; border-radius:7px}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-w{font-size:10px; text-align:center; color:var(--ink-400); padding:3px 0; font-weight:800}
  .cal-day{text-align:center; padding:6px 0; border-radius:7px; font-size:11px; background:#fff; cursor:pointer; transition:.15s; user-select:none; color:var(--ink-700); font-weight:600; border:1.5px solid var(--line-2)}
  .cal-day:hover{background:var(--amber-50); border-color:var(--amber-300)}
  .cal-day.checked{background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; border-color:var(--amber-600); font-weight:800; box-shadow:0 2px 6px rgba(217,119,6,.3)}
  .cal-day.today{outline:2px solid var(--rose-500); outline-offset:1.5px}
  .cal-day.empty{background:transparent; cursor:default; border-color:transparent}
  .cal-day.empty:hover{background:transparent; transform:none}
  .ms{background:#fff; border-radius:var(--r-md); padding:16px; margin-bottom:10px; border:1.5px solid var(--line-2); transition:.2s; box-shadow:0 1px 2px rgba(120,80,40,.03)}
  .ms:hover{border-color:var(--line-1); box-shadow:var(--sh-xs)}
  .ms-head{display:flex; justify-content:space-between; align-items:center; gap:9px; margin-bottom:12px; flex-wrap:wrap}
  .ms-title{font-size:13.5px; font-weight:800; flex:1; min-width:80px; color:var(--ink-900); display:flex; align-items:center; gap:7px}
  .ms-title::before{content:'◆'; font-size:9px; color:var(--amber-500)}
  .ms-progress-big{font-size:10.5px; color:var(--amber-800); font-weight:800; background:var(--amber-50); padding:4px 11px; border-radius:999px; white-space:nowrap; border:1px solid rgba(217,119,6,.2)}
  .ms-bar{position:relative; height:10px; border-radius:999px; margin-bottom:16px; background:var(--card-3); border:1px solid var(--line-1)}
  .ms-bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#fbbf24 0%,#f59e0b 55%,#e11d48 100%); transition:width .35s; box-shadow:0 0 8px rgba(251,146,60,.4)}
  .ms-node-mark{position:absolute; top:-3px; width:2px; height:16px; background:var(--ink-400); border-radius:2px; transform:translateX(-1px); pointer-events:none; box-shadow:0 0 0 1px #fff}
  .ms-slider-wrap{display:flex; align-items:center; gap:12px; margin-bottom:12px}
  .ms-slider{-webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; background:linear-gradient(90deg,#f59e0b var(--p,0%), var(--card-3) var(--p,0%)); outline:none; padding:0; border:none; cursor:pointer; min-width:70px}
  .ms-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%; background:linear-gradient(135deg,#fbbf24,#d97706); border:3px solid #fff; cursor:grab; box-shadow:0 2px 8px rgba(217,119,6,.5)}
  .ms-slider::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:linear-gradient(135deg,#fbbf24,#d97706); border:3px solid #fff; cursor:grab}
  .ms-pct-big{font-size:13px; color:var(--amber-700); font-weight:800; width:44px; text-align:right}
  .ms-nodes{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-top:10px; border-top:1px solid var(--line-2)}
  .ms-nodes-label{font-size:10px; color:var(--ink-400); font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-right:2px}
  .ms-node-tag{display:inline-flex; align-items:center; gap:5px; background:var(--card-2); border:1px solid var(--line-1); border-radius:7px; padding:3px 9px; font-size:11px; color:var(--ink-600); font-weight:600; transition:.18s}
  .ms-node-tag:hover{border-color:var(--ink-300); background:#fff}
  .ms-node-tag .pct{color:var(--amber-700); font-weight:800}
  .ms-node-tag button{background:transparent; border:none; color:var(--red); padding:0 1px; font-size:12px; cursor:pointer; font-weight:900; opacity:.5; box-shadow:none}
  .ms-node-tag button:hover{opacity:1; background:transparent}
  .ms-node-tag.active{border-color:var(--amber-400); background:var(--amber-50); color:var(--amber-800)}
  .shop-item{display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-radius:var(--r); margin-bottom:6px; gap:9px; background:#fff; border:1.5px solid var(--line-2); transition:.2s; box-shadow:0 1px 2px rgba(120,80,40,.03)}
  .shop-item:hover{border-color:var(--line-1); transform:translateX(2px); box-shadow:var(--sh-xs)}
  .shop-item .lbl{font-size:12.5px; color:var(--ink-900); font-weight:600; display:flex; align-items:center; gap:8px}
  .chest{display:flex; justify-content:space-between; align-items:center; gap:11px; padding:12px 14px; border-radius:var(--r); margin-bottom:7px; background:#fff; border:1.5px solid var(--line-2); transition:.22s; box-shadow:0 1px 2px rgba(120,80,40,.03)}
  .chest:hover{border-color:var(--line-1)}
  .chest.ready{border-color:var(--amber-300); background:linear-gradient(180deg,var(--amber-50),#fefce8); box-shadow:0 6px 18px -8px rgba(251,191,36,.5)}
  .chest-icon{width:42px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; border-radius:11px; background:linear-gradient(135deg,#fef3c7,#fde68a); border:1px solid var(--amber-200)}
  .chest.ready .chest-icon{background:linear-gradient(135deg,#fde68a,#fbbf24); border-color:var(--amber-300)}
  .chest .info{flex:1; min-width:0}
  .chest .cname{font-size:12.5px; font-weight:800; margin-bottom:3px; color:var(--ink-900)}
  .chest .cond{font-size:10.5px; color:var(--ink-500); font-weight:600}
  .chest .rw{font-size:10.5px; color:var(--amber-800); margin-top:3px; font-weight:700}

<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🌅</div>
      <div class="txt">人生<em>RPG</em></div>
    </div>
    <div class="auth-tabs">
      <button id="tabSignin" class="active" onclick="switchAuthMode('signin')">登录</button>
      <button id="tabSignup" onclick="switchAuthMode('signup')">注册</button>
    </div>
    <div class="auth-field">
      <label>邮箱</label>
      <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>密码</label>
      <input id="authPassword" type="password" placeholder="至少 6 位" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitAuth()">
    </div>
    <button id="authSubmit" class="auth-btn" onclick="submitAuth()">登录</button>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-hint">
      注册后需要去邮箱点击验证链接<br>验证通过后再回来登录
    </div>
  </div>
</div>

<div id="appScreen">
<header>
  <div class="brand">
    <div class="avatar">🌅</div>
    <div class="brand-text">
      <div class="brand-name">人生<em>RPG</em></div>
      <div class="brand-sub">LIFE QUEST</div>
    </div>
  </div>
  <div class="player">
    <div class="level-badge" id="levelBadge">Lv.1</div>
    <div class="xp-wrap">
      <div class="xp-label"><span>Experience</span><span id="xpText">0 / 1000</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <div class="coins">🪙 <span id="coinText">0</span></div>
    <div class="cloud-status" id="cloudStatus"><span class="dot"></span><span id="cloudText">已同步</span></div>
    <button class="icon-btn" onclick="openStatEditor()" title="编辑属性">✎</button>
    <button class="icon-btn ghost" onclick="doSignOut()" title="退出登录">⎋</button>
  </div>
</header>

<main>
  <div class="col">
    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">今日任务</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="taskName" placeholder="输入任务..." style="flex:1; min-width:130px">
        <input id="taskXP" type="number" value="30" min="1" style="width:60px" title="XP">
        <input id="taskCoins" type="number" value="5" min="0" style="width:60px" title="金币">
        <button class="btn-primary" onclick="addTask()">+ 添加</button>
      </div>
      <div id="taskList"></div>
      <div class="sub" id="taskSummary"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">每日打卡</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="checkinName" placeholder="打卡任务..." style="flex:1; min-width:120px">
        <input id="checkinXP" type="number" value="5" min="0" style="width:60px" title="XP">
        <input id="checkinCoins" type="number" value="2" min="0" style="width:60px" title="金币">
        <button class="btn-primary" onclick="addCheckin()">+ 添加</button>
      </div>
      <div id="checkinList"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">里程碑</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="msName" placeholder="里程碑名称..." style="flex:1; min-width:130px">
        <button class="btn-primary" onclick="addMilestone()">+ 创建</button>
      </div>
      <div id="msList"></div>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">奖励商店</span></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="rewardName" placeholder="奖励名..." style="flex:1; min-width:100px">
        <input id="rewardCost" type="number" value="50" min="1" style="width:60px" title="金币">
        <button class="btn-pink" onclick="addReward()">+ 添加</button>
      </div>
      <div id="rewardList"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">条件宝箱</span></span></h2>
      <div class="row" style="margin-bottom:7px">
        <input id="chestName" placeholder="宝箱名..." style="flex:1; min-width:100px">
        <select id="chestType" style="flex:1; min-width:120px">
          <option value="todayTasks">今日任务数 ≥</option>
          <option value="todayXP">今日 XP ≥</option>
          <option value="weekTasks">本周任务数 ≥</option>
          <option value="todayCheckins">今日打卡数 ≥</option>
          <option value="manual">手动开启</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:12px">
        <input id="chestValue" type="number" value="3" min="1" style="width:60px" title="条件">
        <input id="chestCoins" type="number" value="30" min="0" style="width:60px" title="金币">
        <input id="chestXP" type="number" value="20" min="0" style="width:60px" title="XP">
        <button class="btn-gold" onclick="addChest()" style="flex:1">+ 添加宝箱</button>
      </div>
      <div id="chestList"></div>
    </section>

    <section class="panel">
      <h2><span class="h2-left"><span class="h2-deco"></span><span class="h2-text">惊喜宝箱</span></span></h2>
      <div class="row" style="margin-bottom:7px">
        <input id="spName" placeholder="奖励名..." style="flex:2; min-width:90px">
        <input id="spWeight" type="number" value="10" min="1" style="width:56px" title="权重">
        <input id="spCoins" type="number" value="0" min="0" style="width:54px" title="金币">
        <input id="spXP" type="number" value="0" min="0" style="width:54px" title="XP">
        <button class="btn-pink" onclick="addSurprise()">+</button>
      </div>
      <div id="surpriseList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn-gold" style="flex:1; padding:13px; font-size:13.5px" onclick="drawSurprise()">🎲 开启惊喜宝箱</button>
      </div>
      <div id="lastSurprise"></div>
    </section>

    <section class="panel">
      <h2>
        <span class="h2-left"><span class="h2-deco"></span><span class="h2-text">日志</span></span>
        <span class="h2-actions">
          <button class="btn-gold btn-sm" onclick="openSummary()">📝 今日总结</button>
        </span>
      </h2>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<div class="footer">
  <button class="btn-ghost" onclick="resetDay()">🌅 重置今日</button>
  <button class="btn-ghost" onclick="exportSave()">⬇ 导出</button>
  <button class="btn-ghost" onclick="document.getElementById('importFile').click()">⬆ 导入</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSave(event)">
  <button class="btn-danger" onclick="wipe()">清空数据</button>
</div>
</div>

<div class="modal" id="summaryModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📝 今日总结</h3>
      <button onclick="closeSummary()">×</button>
    </div>
    <div class="modal-body" id="summaryContent"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="copySummary()">📋 复制</button>
      <button class="btn-primary" onclick="closeSummary()">关闭</button>
    </div>
  </div>
</div>

<div class="modal" id="statModal">
  <div class="modal-content" style="max-width:420px">
    <div class="modal-header">
      <h3>✎ 编辑属性</h3>
      <button onclick="closeStatEditor()">×</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="stat-field">
          <div class="stat-field-label"><span class="ico lv">★</span>等级 Lv.</div>
          <input id="editLevel" type="number" min="1" style="width:120px">
        </div>
        <div class="stat-field">
          <div class="stat-field-label"><span class="ico xp">✦</span>经验值 XP</div>
          <input id="editXP" type="number" min="0" style="width:120px">
        </div>
        <div class="stat-field">
          <div class="stat-field-label"><span class="ico coin">◈</span>金币</div>
          <input id="editCoins" type="number" min="0" style="width:120px">
        </div>

function normalizeState(s){
  if(!s) return defaultState();
  var d = defaultState();
  var merged = Object.assign({}, d, s);
  merged.stats = Object.assign({}, d.stats, s.stats || {});
  merged.chestClaims = s.chestClaims || {};
  merged.dailyStats = s.dailyStats || {};
  merged.dailySummaries = s.dailySummaries || {};
  if(!Array.isArray(merged.chests)) merged.chests = d.chests;
  if(!Array.isArray(merged.tasks)) merged.tasks = d.tasks;
  if(!Array.isArray(merged.rewards)) merged.rewards = d.rewards;
  if(!Array.isArray(merged.checkins)) merged.checkins = d.checkins;
  if(!Array.isArray(merged.milestones)) merged.milestones = d.milestones;
  if(!Array.isArray(merged.surprises)) merged.surprises = d.surprises;
  merged.tasks = merged.tasks.map(function(t){
    return { id: t.id || uid(), name: t.name || '任务', xp: Math.max(0, t.xp || 0), coins: Math.max(0, t.coins || 0), done: !!t.done };
  });
  merged.checkins = merged.checkins.map(function(c){
    return { id: c.id || uid(), name: c.name || '打卡', xp: Math.max(0, c.xp === undefined ? 5 : c.xp), coins: Math.max(0, c.coins === undefined ? 2 : c.coins), records: c.records || {} };
  });
  merged.milestones = merged.milestones.map(function(m){
    var nm = { id: m.id || uid(), name: m.name || '里程碑', progress: 0, nodes: [] };
    if(Array.isArray(m.nodes) && m.nodes.length > 0){
      nm.progress = Math.max(0, Math.min(100, m.progress || 0));
      nm.nodes = m.nodes.map(function(n){
        return { id: n.id || uid(), percent: Math.max(0, Math.min(100, n.percent || 0)), label: n.label || ((n.percent || 0) + '%') };
      });
    }else if(Array.isArray(m.items) && m.items.length > 0){
      var sum = 0;
      m.items.forEach(function(it){ sum += (it.percent || 0); });
      nm.progress = Math.round(sum / m.items.length);
      nm.nodes = m.items.map(function(it){
        return { id: it.id || uid(), percent: Math.max(0, Math.min(100, it.percent || 0)), label: it.name || '' };
      });
    }
    var has0 = nm.nodes.some(function(n){ return n.percent === 0; });
    var has100 = nm.nodes.some(function(n){ return n.percent === 100; });
    if(!has0) nm.nodes.push({ id: uid(), percent: 0, label: '开始' });
    if(!has100) nm.nodes.push({ id: uid(), percent: 100, label: '完成' });
    nm.nodes.sort(function(a,b){ return a.percent - b.percent; });
    return nm;
  });
  merged.surprises = merged.surprises.map(function(s){
    return { id: s.id || uid(), name: s.name || '奖励', weight: Math.max(1, s.weight || 1), coins: Math.max(0, s.coins || 0), xp: Math.max(0, s.xp || 0) };
  });
  delete merged.skills;
  if(!Array.isArray(merged.logs)) merged.logs = [];
  merged.logs = merged.logs.map(function(l){
    return typeof l === 'string' ? { date: todayStr(), time: '', text: l } : l;
  });
  return merged;
}

function setCloudStatus(status, text){

async function pushToCloud(){

async function submitAuth(){
  var email = document.getElementById('authEmail').value.trim();
  var password = document.getElementById('authPassword').value;
  if(!email){ showAuthMsg('err', '请输入邮箱'); return; }
  if(!password || password.length < 6){ showAuthMsg('err', '密码至少 6 位'); return; }
  var btn = document.getElementById('authSubmit');
  btn.disabled = true;
  var origText = btn.textContent;
  btn.textContent = authMode === 'signin' ? '登录中...' : '注册中...';
  hideAuthMsg();
  try{
    if(authMode === 'signup'){
      var { data, error } = await supabase.auth.signUp({ email: email, password: password });
      if(error) throw error;
      if(data.user && !data.session){
        showAuthMsg('ok', '✅ 注册成功！<br>我们已向 <b>' + escapeHtml(email) + '</b> 发送了一封验证邮件。<br>请去邮箱点击验证链接，然后回来登录。');
        document.getElementById('authPassword').value = '';
      }else if(data.session){
        currentUser = data.user;
        await afterLogin();
      }
    }else{
      var { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
      if(error) throw error;
      if(!data.user) throw new Error('登录失败');
      currentUser = data.user;
      await afterLogin();
    }
  }catch(e){
    var msg = e.message || '操作失败';
    if(msg.toLowerCase().indexOf('email not confirmed') >= 0){
      showAuthMsg('err', '⚠️ 邮箱还未验证，请先去邮箱点击验证链接。');
    }else if(msg.toLowerCase().indexOf('invalid login') >= 0){
      showAuthMsg('err', '邮箱或密码不对，请检查。');
    }else if(msg.toLowerCase().indexOf('already registered') >= 0){
      showAuthMsg('err', '这个邮箱已经注册过了，请直接登录。');
    }else{
      showAuthMsg('err', escapeHtml(msg));
    }
  }finally{
    btn.disabled = false;
    btn.textContent = origText;
  }
}

  undoStack.push(JSON.stringify(state));
  if(undoStack.length > MAX_UNDO) undoStack.shift();

function log(text){
  var now = new Date();
  state.logs.unshift({
    date: dateStr(now),
    time: now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
    text: text
  });
  if(state.logs.length > 500) state.logs.length = 500;
}
function bumpDailyStat(key, delta){
  var d = todayStr();
  if(!state.dailyStats[d]) state.dailyStats[d] = { tasksDone: 0, xp: 0, checkins: 0 };
  if(state.dailyStats[d][key] === undefined) state.dailyStats[d][key] = 0;
  state.dailyStats[d][key] = Math.max(0, state.dailyStats[d][key] + delta);
}
function applyXP(amount){
  state.xp += amount;
  if(state.xp < 0) state.xp = 0;
  var lv = 0;
  while(state.xp >= XP_PER_LEVEL){ state.xp -= XP_PER_LEVEL; state.level++; lv++; }
  return lv;
}
function doDailyReset(silent){
  state.tasks.forEach(function(t){ t.done = false; });
  state.lastReset = todayStr();
  state.stats.todayDate = todayStr();
  state.stats.todayTasksDone = 0;
  state.stats.todayXP = 0;
  state.stats.todayCheckins = 0;
  var ws = getWeekStart();
  if(ws !== state.stats.weekStart){ state.stats.weekStart = ws; state.stats.weekTasksDone = 0; }
  if(!silent) log('🌅 新的一天，任务已重置');
}
function resetDay(){

  toast('新的一天，开始吧！');
}
function checkNewDay(){

}

    state.stats.todayTasksDone++;
    state.stats.weekTasksDone++;
    state.stats.todayXP += t.xp;
    bumpDailyStat('tasksDone', 1);
    bumpDailyStat('xp', t.xp);
    var lv = applyXP(t.xp);
    state.coins += t.coins;
    log('✅ 完成：' + t.name + ' (+' + t.xp + ' XP, +' + t.coins + ' 金币)');
    if(lv > 0) log('🎉 升级！Lv.' + state.level);

  }else{
    t.done = false;
    state.stats.todayTasksDone = Math.max(0, state.stats.todayTasksDone - 1);
    state.stats.weekTasksDone = Math.max(0, state.stats.weekTasksDone - 1);
    state.stats.todayXP = Math.max(0, state.stats.todayXP - t.xp);
    bumpDailyStat('tasksDone', -1);
    bumpDailyStat('xp', -t.xp);
    applyXP(-t.xp);
    state.coins = Math.max(0, state.coins - t.coins);
    log('↩ 取消完成：' + t.name);

  }else{

      var lv = applyXP(c.xp);
      state.coins += c.coins;

}

  pushUndo();
  m.nodes.push({ id: uid(), percent: pct, label: label });

function currentMsNode(m){

  var cur = null;
  for(var i = 0; i < sorted.length; i++){
    if(m.progress >= sorted[i].percent) cur = sorted[i];
    else break;
  }
  return cur;
}
function updateMsProgress(msId, value){

  var wrap = document.querySelector('.ms[data-id="' + msId + '"]');
  if(!wrap) return;
  var cur = currentMsNode(m);
  var big = wrap.querySelector('.ms-progress-big');
  var pct = wrap.querySelector('.ms-pct-big');
  var bar = wrap.querySelector('.ms-bar-fill');
  var slider = wrap.querySelector('.ms-slider');
  if(big) big.textContent = m.progress + '% · ' + (cur ? cur.label : '未开始');
  if(pct) pct.textContent = m.progress + '%';
  if(bar) bar.style.width = m.progress + '%';
  if(slider) slider.style.setProperty('--p', m.progress + '%');

function drawSurprise(){
  if(state.surprises.length === 0) return toast('还没有惊喜奖励');
  var total = 0;
  state.surprises.forEach(function(s){ total += Math.max(1, s.weight || 1); });
  var roll = Math.random() * total;
  var picked = state.surprises[state.surprises.length - 1];
  for(var i = 0; i < state.surprises.length; i++){
    var s = state.surprises[i];
    roll -= Math.max(1, s.weight || 1);
    if(roll <= 0){ picked = s; break; }
  }
  pushUndo();
  var parts = [];
  if(picked.coins > 0){ state.coins += picked.coins; parts.push('🪙 +' + picked.coins); }
  var lv = 0;
  if(picked.xp > 0){ lv = applyXP(picked.xp); parts.push('+' + picked.xp + ' XP'); }
  var rewardText = parts.join(' · ') || '（无金币/XP，但也是惊喜）';
  state.lastSurprise = { name: picked.name, rewardText: rewardText, time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) };
  log('🎊 惊喜宝箱抽中：「' + picked.name + '」 ' + rewardText);
  if(lv > 0) log('🎉 升级！Lv.' + state.level);
  save(); render();
  toast('🎊 抽中：' + picked.name + '！');
}

function buildCalendar(c){
  var y = calendarView.year, m = calendarView.month;
  var firstDay = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var weekLabels = ['一','二','三','四','五','六','日'];
  var html = '<div class="cal-head">';
  html += '<button class="btn-ghost btn-sm" onclick="event.stopPropagation();calShiftMonth(-1)">◀</button>';
  html += '<span>' + y + ' 年 ' + (m + 1) + ' 月</span>';
  html += '<button class="btn-ghost btn-sm" onclick="event.stopPropagation();calShiftMonth(1)">▶</button>';
  html += '</div><div class="cal-grid">';
  weekLabels.forEach(function(w){ html += '<div class="cal-w">' + w + '</div>'; });
  var startOffset = firstDay === 0 ? 6 : firstDay - 1;
  for(var i = 0; i < startOffset; i++) html += '<div class="cal-day empty"></div>';
  var todayKey = todayStr();
  for(var d = 1; d <= daysInMonth; d++){
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var checked = c.records[ds];
    var isToday = ds === todayKey;
    var cls = 'cal-day';
    if(checked) cls += ' checked';
    if(isToday) cls += ' today';
    html += '<div class="' + cls + '" onclick="event.stopPropagation();toggleCheckin(\'' + c.id + '\',\'' + ds + '\')">' + d + '</div>';
  }
  html += '</div>';
  return html;
}

    var canOpen = ready && !claimed;

    if(claimed) btn = '<button class="btn-ghost btn-sm" disabled>已开</button>';
    else if(canOpen) btn = '<button class="btn-gold btn-sm" onclick="openChest(\'' + c.id + '\')">开启</button>';
    else btn = '<button class="btn-ghost btn-sm" disabled>未达成</button>';
    html += '<div class="chest ' + (canOpen ? 'ready' : '') + '">';
    html += '<div class="chest-icon">' + (canOpen ? '🎁' : '📦') + '</div>';
    html += '<div class="info">';
    html += '<div class="cname">' + escapeHtml(c.name) + '</div>';
    html += '<div class="cond">' + chestConditionText(c) + ' · ' + chestProgress(c) + '</div>';
    html += '<div class="rw">' + chestRewardText(c) + '</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:4px;flex-shrink:0">';
    html += btn;
    html += '<button class="btn-danger btn-sm" onclick="delChest(\'' + c.id + '\')">删</button>';
    html += '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderSurprises(){
  var el = document.getElementById('surpriseList');
  if(state.surprises.length === 0){
    el.innerHTML = '<div class="empty">还没有惊喜奖励</div>';
  }else{
    var probs = surpriseProbabilities();
    var html = '';
    probs.forEach(function(s){
      html += '<div class="surprise-row">';
      html += '<div class="sname">' + escapeHtml(s.name) + '</div>';
      html += '<span class="sw">' + s.weight + ' 点</span>';
      html += '<span class="sp">' + s.prob.toFixed(1) + '%</span>';
      html += '<button class="btn-ghost btn-sm" onclick="editSurprise(\'' + s.id + '\')">编</button>';
      html += '<button class="btn-danger btn-sm" onclick="delSurprise(\'' + s.id + '\')">删</button>';
      html += '</div>';
    });
    el.innerHTML = html;
  }
  var last = document.getElementById('lastSurprise');
  if(state.lastSurprise){
    last.innerHTML = '<div class="last-surprise">' +
      '<span class="lbl">上次抽中 · ' + state.lastSurprise.time + '</span>' +
      '<div style="font-size:16px;font-weight:800;color:#be185d">🎊 ' + escapeHtml(state.lastSurprise.name) + '</div>' +
      '<div style="font-size:11.5px;color:var(--ink-600);margin-top:6px;font-weight:600">' + escapeHtml(state.lastSurprise.rewardText) + '</div>' +
      '</div>';
  }else{
    last.innerHTML = '';
  }
}

function renderLogs(){
  var el = document.getElementById('log');
  if(!state.logs || state.logs.length === 0){
    el.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }
  var groups = {};
  state.logs.forEach(function(l){
    var d = l.date || todayStr();
    if(!groups[d]) groups[d] = [];
    groups[d].push(l);
  });
  var dates = Object.keys(groups).sort().reverse();
  var today = todayStr();
  var html = '';
  dates.forEach(function(d){
    var isToday = (d === today);
    var label = isToday ? ('今天 · ' + d) : d;
    var items = '';
    groups[d].forEach(function(l){
      items += '<div class="log-item">' + (l.time ? '[' + l.time + '] ' : '') + escapeHtml(l.text) + '</div>';
    });
    html += '<div class="log-folder ' + (isToday ? 'open' : '') + '" data-date="' + d + '">';
    html += '<div class="folder-head" onclick="toggleFolder(\'' + d + '\')">';
    html += '<span class="tri">' + (isToday ? '▼' : '▶') + '</span>';
    html += '<span>' + (isToday ? '📂' : '📁') + ' ' + label + ' · ' + groups[d].length + '</span>';
    html += '</div>';
    html += '<div class="folder-body ' + (isToday ? '' : 'hidden') + '">' + items + '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}
function toggleFolder(date){
  var folder = document.querySelector('.log-folder[data-date="' + date + '"]');
  if(!folder) return;
  var body = folder.querySelector('.folder-body');
  var tri = folder.querySelector('.tri');
  var isOpen = folder.classList.toggle('open');
  body.classList.toggle('hidden', !isOpen);
  tri.textContent = isOpen ? '▼' : '▶';
}

function computeSummaryData(){
  var today = todayStr();
  var s = state.stats;
  var doneTasks = state.tasks.filter(function(t){ return t.done; });
  var undoneTasks = state.tasks.filter(function(t){ return !t.done; });
  var totalTasks = state.tasks.length;
  var completionRate = totalTasks > 0 ? Math.round(doneTasks.length / totalTasks * 100) : 0;
  var todayCheckins = state.checkins.filter(function(c){ return c.records[today]; }).length;
  var totalCheckinTasks = state.checkins.length;
  var yd = dateStr(new Date(Date.now() - 86400000));
  var yStats = state.dailyStats[yd] || { tasksDone: 0, xp: 0, checkins: 0 };
  var ws = state.stats.weekStart;
  var weekXP = 0, weekDays = 0;
  Object.keys(state.dailyStats).forEach(function(d){
    if(d >= ws && d < today){ weekXP += state.dailyStats[d].xp || 0; weekDays++; }
  });
  var avgXP = weekDays > 0 ? Math.round(weekXP / weekDays) : 0;
  return { today: today, s: s, doneTasks: doneTasks, undoneTasks: undoneTasks, totalTasks: totalTasks, completionRate: completionRate, todayCheckins: todayCheckins, totalCheckinTasks: totalCheckinTasks, yStats: yStats, avgXP: avgXP };
}

function summaryHTML(){
  var d = computeSummaryData();
  var today = d.today, s = d.s, doneTasks = d.doneTasks, undoneTasks = d.undoneTasks;
  var totalTasks = d.totalTasks, completionRate = d.completionRate;
  var todayCheckins = d.todayCheckins, totalCheckinTasks = d.totalCheckinTasks;
  var yStats = d.yStats, avgXP = d.avgXP;
  var hour = new Date().getHours();
  var greeting = hour < 6 ? '夜深了 🌙' : hour < 12 ? '早上好 ☀️' : hour < 18 ? '下午好 🌤' : '晚上好 🌆';
  var dateReadable = today.replace(/-/g, ' / ');
  var ringColor = completionRate >= 80 ? '#059669' : completionRate >= 50 ? '#f59e0b' : '#e11d48';
  var maxXP = Math.max(s.todayXP, yStats.xp || 0, avgXP, 1);
  var todayPct = Math.round(s.todayXP / maxXP * 100);
  var yPct = Math.round((yStats.xp || 0) / maxXP * 100);
  var avgPct = Math.round(avgXP / maxXP * 100);
  var diffXP = s.todayXP - (yStats.xp || 0);
  var diffClass = diffXP > 0 ? 'up' : diffXP < 0 ? 'down' : '';
  var diffText = diffXP > 0 ? ('↑ 比昨天多 ' + diffXP) : diffXP < 0 ? ('↓ 比昨天少 ' + Math.abs(diffXP)) : '与昨天持平';
  var html = '';
  html += '<div class="sum-greeting"><div class="date">' + dateReadable + '</div><div class="hi">' + greeting + '</div></div>';
  html += '<div class="sum-visuals">';
  html += '<div class="sv-card"><div class="ring" style="background:conic-gradient(' + ringColor + ' 0% ' + completionRate + '%, #f1ebdf ' + completionRate + '% 100%)"><div class="ring-inner"><span>' + completionRate + '%</span></div></div><div class="sv-label">完成率</div><div class="sv-sub">' + doneTasks.length + ' / ' + totalTasks + '</div></div>';
  html += '<div class="sv-card"><div class="sv-num">' + s.todayXP + '</div><div class="sv-label">今日 XP</div><div class="sv-sub ' + diffClass + '">' + diffText + '</div></div>';
  html += '<div class="sv-card"><div class="sv-num">' + todayCheckins + '<span style="font-size:13px;color:var(--ink-400)">/' + totalCheckinTasks + '</span></div><div class="sv-label">今日打卡</div><div class="sv-sub">' + (totalCheckinTasks > 0 ? (todayCheckins === totalCheckinTasks ? '全部完成 ✨' : '继续加油') : '还没有打卡') + '</div></div>';
  html += '<div class="sv-card"><div class="sv-num">' + avgXP + '</div><div class="sv-label">本周日均</div><div class="sv-sub">' + (s.todayXP > avgXP ? '↑ 高于平均' : s.todayXP < avgXP ? '↓ 低于平均' : '与平均持平') + '</div></div>';
  html += '</div>';
  html += '<div class="compare-chart"><div class="cc-title">XP 对比</div>';
  html += '<div class="bar-row"><span class="bar-label">昨天</span><div class="bar-track"><div class="bar-fill" style="width:' + yPct + '%;background:linear-gradient(90deg,#fde68a,#fcd34d)"></div></div><span class="bar-val">' + (yStats.xp || 0) + '</span></div>';
  html += '<div class="bar-row"><span class="bar-label">今天</span><div class="bar-track"><div class="bar-fill" style="width:' + todayPct + '%;background:linear-gradient(90deg,#fbbf24,#f59e0b)"></div></div><span class="bar-val">' + s.todayXP + '</span></div>';
  html += '<div class="bar-row"><span class="bar-label">周均</span><div class="bar-track"><div class="bar-fill" style="width:' + avgPct + '%;background:linear-gradient(90deg,#c4b5fd,#a78bfa)"></div></div><span class="bar-val">' + avgXP + '</span></div>';
  html += '</div>';
  if(state.checkins.length > 0){
    html += '<div class="checkin-dots"><div class="cd-title">今日打卡</div>';
    state.checkins.forEach(function(c){
      var on = !!c.records[today];
      var st = streakCheckin(c);
      html += '<div class="dot-row"><div class="dot ' + (on ? 'on' : '') + '">' + (on ? '✓' : '') + '</div><div class="dr-name">' + escapeHtml(c.name) + '</div><div class="dr-streak">' + (st > 0 ? ('连续 ' + st + ' 天') : '未开始') + '</div></div>';
    });
    html += '</div>';
  }
  if(state.milestones.length > 0){
    html += '<div class="milestones-mini"><div class="mm-title">里程碑</div>';
    state.milestones.forEach(function(m){
      var cur = currentMsNode(m);
      html += '<div class="ms-mini"><div class="ms-mini-head"><div class="name">' + escapeHtml(m.name) + '<span class="cur">' + (cur ? escapeHtml(cur.label) : '') + '</span></div><div class="pct">' + m.progress + '%</div></div><div class="ms-mini-bar"><div style="width:' + m.progress + '%"></div></div></div>';
    });
    html += '</div>';
  }
  html += '<div class="sum-block"><div class="bk-title">今天发生了什么</div>';
  if(totalTasks === 0){
    html += '<p>今天还没有设置任务。没有目标的一天也是允许的。</p>';
  }else if(doneTasks.length === 0){
    html += '<p>今天设了 <b>' + totalTasks + '</b> 个任务，但一个都还没完成。</p>';
    html += '<p>没关系，明天把目标缩小一点，小到"你肯定能做到"。</p>';
  }else{
    html += '<p>今天完成了 <b>' + doneTasks.length + '/' + totalTasks + '</b> 个任务，拿到 <b>' + s.todayXP + ' XP</b>。</p>';
    if(completionRate === 100) html += '<p>✨ 全部完成！执行力值得被看见。</p>';
    else if(completionRate >= 70) html += '<p>完成率 <b>' + completionRate + '%</b>，很稳。</p>';
    else if(completionRate >= 40) html += '<p>完成率 <b>' + completionRate + '%</b>，还有空间。明天挑最重要的先做。</p>';
    else html += '<p>完成率 <b>' + completionRate + '%</b>，今天状态一般。明天重新出发。</p>';
  }
  html += '</div>';
  if(doneTasks.length > 0){
    html += '<div class="sum-block"><div class="bk-title">已完成</div><ul class="sum-list">';
    doneTasks.forEach(function(t){
      html += '<li class="done">' + escapeHtml(t.name) + '<span class="xp-tag">+' + t.xp + ' XP</span></li>';
    });
    html += '</ul></div>';
  }
  if(undoneTasks.length > 0){
    html += '<div class="sum-block"><div class="bk-title">待完成</div><ul class="sum-list">';
    undoneTasks.forEach(function(t){
      html += '<li class="todo">' + escapeHtml(t.name) + '<span class="xp-tag">' + t.xp + ' XP</span></li>';
    });
    html += '</ul></div>';
  }
  var critiques = [];
  if(totalTasks > 0 && doneTasks.length < totalTasks * 0.5){ critiques.push('今天任务完成率偏低。可能任务设得太多，明天试着只留 3 个。'); }
  if(s.todayXP > 0 && s.todayXP < 50 && doneTasks.length > 0){ critiques.push('今天 XP 收获不多。可以挑一段 25 分钟完全无干扰的专注时间试试。'); }
  if(undoneTasks.some(function(t){ return t.xp >= 60; })){ critiques.push('高价值任务还没动，明天优先安排它们在精力最好的时段。'); }
  if(totalCheckinTasks > 0 && todayCheckins === 0){ critiques.push('今天打卡一项都没完成。明天先做 1 项把链条接上。'); }
  if(critiques.length > 0){
    html += '<div class="tip-box"><div class="tb-title">🌱 温和的提醒</div>';
    critiques.forEach(function(c){ html += '<p>· ' + escapeHtml(c) + '</p>'; });
    html += '</div>';
  }
  var praises = [];
  if(doneTasks.length > 0) praises.push('你今天迈出了实实在在的步伐，值得肯定。');
  if(s.todayXP >= 100) praises.push('今天 ' + s.todayXP + ' XP，高效的一天，记住这种感觉。');
  if(todayCheckins > 0) praises.push('打卡 ' + todayCheckins + ' 项，习惯正在悄悄成形。');
  if(doneTasks.length >= 3) praises.push('一口气完成 ' + doneTasks.length + ' 个任务，很稳。');
  if(avgXP > 0 && s.todayXP > avgXP) praises.push('今天超过本周平均水平，进步看得见。');
  if(praises.length === 0) praises.push('哪怕今天只完成了一件小事，也是在前进。');
  html += '<div class="warm-box"><div class="wb-title">💛 给你的话</div>';
  praises.forEach(function(p){ html += '<p>· ' + escapeHtml(p) + '</p>'; });
  html += '</div>';
  var tomorrowText;
  if(undoneTasks.length > 0){
    var first = undoneTasks.slice().sort(function(a,b){ return b.xp - a.xp; })[0];
    tomorrowText = '明天先做「' + first.name + '」，完成它你就赢了一半。';
  }else if(totalTasks === 0){
    tomorrowText = '明天早上，先写下 1 件非做不可的小事。';
  }else{
    tomorrowText = '今天全部清空，明天可以稍微加点难度，或给自己留半天休息。';
  }
  html += '<div class="tomorrow-box"><div class="tb-label">🌅 给明天的一句话</div><div class="tb-text">' + escapeHtml(tomorrowText) + '</div></div>';
  html += '<div class="well-done">晚安，明天见 🌙</div>';
  return html;
}

function openSummary(){
  if(!state.dailySummaries) state.dailySummaries = {};
  state.dailySummaries[todayStr()] = 'summary';
  log('📝 生成今日总结');
  save();
  document.getElementById('summaryContent').innerHTML = summaryHTML();
  document.getElementById('summaryModal').classList.add('show');
  render();
}
function closeSummary(){
  document.getElementById('summaryModal').classList.remove('show');
}
function copySummary(){
  var el = document.getElementById('summaryContent');
  var text = el ? el.innerText : '';
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast('已复制'); });
  }else{
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制');
  }
}

document.getElementById('summaryModal').addEventListener('click', function(e){
  if(e.target.id === 'summaryModal') closeSummary();
});
document.getElementById('statModal').addEventListener('click', function(e){
  if(e.target.id === 'statModal') closeStatEditor();
});

var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

function exportSave(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'life-rpg-save-' + todayStr() + '.json';
  a.click();
  toast('已导出');
}
function importSave(e){
  var f = e.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var raw = JSON.parse(ev.target.result);
      state = normalizeState(raw);
      save(); render();
      toast('已导入');
    }catch(err){ toast('导入失败'); }
  };
  reader.readAsText(f);
  e.target.value = '';
}
function wipe(){
  if(!confirm('确定清空当前账号的所有数据？此操作不可恢复。')) return;
  undoStack = [];
  editingTaskId = null; editingCheckinId = null;
  pinnedCalendars.clear();
  state = defaultState();
  save(); render();
  toast('已重置');
}

async function boot(){
  supabase.auth.onAuthStateChange(function(event, session){
    if(event === 'SIGNED_OUT'){
      currentUser = null;
      showAuth();
    }
  });
  var { data: { session } } = await supabase.auth.getSession();
  if(session && session.user){
    currentUser = session.user;
    await afterLogin();
  }else{
    showAuth();
  }
}

boot();
setInterval(checkNewDay, 60000);
</script>
